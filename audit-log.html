<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>監査ログ — 出荷検査成績書</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --ink-soft:#3d4451; --sub:#6b7280; --faint:#a5abb6;
    --line:#e7e9ee; --line-soft:#f0f1f4; --bg:#f5f6f9; --card:#ffffff; --card-2:#fbfbfd;
    --accent:#2451c4; --accent-2:#4d7cf0; --accent-soft:#eef2fc;
    --green:#0f8a53; --green-bg:#e6f7ee;
    --fail:#d33; --fail-bg:#fdecec;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(15,20,35,.04), 0 1px 1px rgba(15,20,35,.03);
    --shadow-md:0 10px 30px rgba(15,20,35,.08);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --ink:#eef1f6; --ink-soft:#c7cdd8; --sub:#8b93a3; --faint:#5c6472;
    --line:#242a35; --line-soft:#1b2029; --bg:#0b0e14; --card:#12161f; --card-2:#151a24;
    --accent:#5b8cff; --accent-2:#7ba2ff; --accent-soft:#182240;
    --green:#2fd88a; --green-bg:#0f2a1e;
    --fail:#ff6b6b; --fail-bg:#2c1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;
  }
  .bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.7;
    background: radial-gradient(700px 380px at 15% -8%, rgba(36,81,196,.14), transparent 60%),
                radial-gradient(600px 340px at 105% 8%, rgba(15,138,83,.1), transparent 55%); }
  html[data-theme="dark"] .bg-glow{ opacity:1; }
  .wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:28px 20px calc(100px + env(safe-area-inset-bottom)); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .topbar a{ color:var(--sub); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
  .topbar a svg{ width:15px; height:15px; }
  .theme-toggle{ width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); box-shadow:var(--shadow-sm); }
  .theme-toggle svg{ width:16px; height:16px; }

  .tabs{ display:flex; gap:6px; margin-bottom:26px; padding:4px; background:var(--card-2); border:1px solid var(--line); border-radius:13px; }
  .tabs a{ flex:1; text-align:center; padding:9px 10px; border-radius:10px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--sub); transition:all .15s ease; }
  .tabs a.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 4px 14px rgba(36,81,196,.35); }

  .header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:20px; }
  .header .eyebrow{ font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; }
  .header h1{ font-size:22px; font-weight:800; margin:0; letter-spacing:-.02em; }
  .header p{ margin:6px 0 0; color:var(--sub); font-size:13px; }
  .export-btn{
    flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:10px 16px; border-radius:11px;
    background:linear-gradient(135deg,var(--green),#17b56b); color:#fff; font-size:12.5px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 4px 14px rgba(15,138,83,.3); transition:transform .12s ease;
  }
  .export-btn:active{ transform:scale(.96); }
  .export-btn svg{ width:15px; height:15px; }

  .search-input-wrap{ position:relative; margin-bottom:16px; }
  .search-input-wrap input{
    width:100%; font-family:inherit; font-size:14.5px; font-weight:500;
    padding:13px 14px 13px 42px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); outline:none; color:var(--ink);
  }
  .search-input-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:.4; }

  .log-table{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
  .log-row{ display:grid; grid-template-columns:118px 68px 1fr 90px; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line-soft); font-size:12px; transition:background .1s ease; }
  .log-row:not(.head):hover{ background:var(--card-2); }
  .log-row:last-child{ border-bottom:none; }
  .log-row.head{ background:var(--card-2); font-weight:700; color:var(--ink-soft); text-transform:uppercase; font-size:10px; letter-spacing:.04em; }
  .log-ts{ font-family:var(--mono); color:var(--sub); font-size:11px; }
  .log-event{ font-weight:700; padding:3px 8px; border-radius:6px; text-align:center; font-size:10.5px; white-space:nowrap; }
  .log-event.SAVE{ background:var(--green-bg); color:var(--green); }
  .log-event.PRINT{ background:var(--accent-soft); color:var(--accent); }
  .log-event.other{ background:var(--fail-bg); color:var(--fail); }
  .log-detail{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); }
  .log-detail .sub{ color:var(--faint); font-size:10.5px; }
  .log-user{ color:var(--sub); font-size:11.5px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .empty{ text-align:center; color:var(--sub); padding:50px 10px; font-size:13.5px; }
  .skeleton-row{ height:44px; margin:8px 16px; border-radius:8px; background:linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
  .result-count{ font-size:11.5px; font-weight:600; color:var(--sub); margin:0 4px 10px; }

  /* ---------- Stats row (biar tidak cuma tabel polos) ---------- */
  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:18px; }
  .stat-card{ background:var(--card); border-radius:var(--radius); padding:14px 12px; box-shadow:var(--shadow-sm); border:1px solid var(--line); }
  .stat-card .stat-num{ font-family:var(--mono); font-size:20px; font-weight:700; line-height:1; color:var(--ink); }
  .stat-card .stat-label{ font-size:10px; color:var(--sub); font-weight:600; margin-top:6px; text-transform:uppercase; letter-spacing:.03em; }

  /* ---------- Admin panel (arsip & backup) ---------- */
  .admin-panel{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .admin-panel button{
    flex:1 1 200px; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px 14px; border-radius:11px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:12px; font-weight:700; cursor:pointer;
    box-shadow:var(--shadow-sm); transition:transform .12s ease;
  }
  .admin-panel button:active{ transform:scale(.97); }
  .admin-panel button svg{ width:15px; height:15px; }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600; padding:11px 20px; border-radius:11px;
    box-shadow:var(--shadow-md); z-index:100; transition:all .25s cubic-bezier(.16,1,.3,1); pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around; align-items:center; background:rgba(255,255,255,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(15,20,35,.06); }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.88); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }

  @media (max-width:640px){
    .log-row{ grid-template-columns:1fr; gap:4px; }
    .log-row.head{ display:none; }
    .log-ts{ order:1; } .log-event{ order:2; justify-self:start; } .log-detail{ order:3; white-space:normal; } .log-user{ order:4; text-align:left; }
    .header{ flex-direction:column; }
  }
</style>
</head>
<body>
<style id="kensaAuthStyle">
  #kensaAuthOverlay{position:fixed;inset:0;z-index:99999;background:rgba(10,14,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;font-family:"Inter","Noto Sans JP",-apple-system,sans-serif;}
  #kensaAuthCard{background:#fff;border-radius:20px;padding:32px 26px;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;}
  #kensaAuthCard .icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1b5fd6,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:22px;}
  #kensaAuthCard h2{font-size:15px;margin:0 0 4px;color:#161b22;font-weight:800;}
  #kensaAuthCard p{font-size:12px;color:#68707c;margin:0 0 18px;}
  #kensaAuthCard input{width:100%;font-size:20px;letter-spacing:.3em;text-align:center;padding:13px;border-radius:12px;border:1.5px solid #e7e9ee;outline:none;font-family:monospace;box-sizing:border-box;}
  #kensaAuthCard input:focus{border-color:#1b5fd6;}
  #kensaAuthCard button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#1b5fd6,#3b82f6);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  #kensaAuthCard button:disabled{opacity:.6;}
  #kensaAuthCard .err{color:#b3261e;font-size:12px;margin-top:10px;min-height:14px;}
  #kensaAuthCard .foot{margin-top:16px;font-size:10.5px;color:#a5abb6;}

  #kensaUserBadge{display:none;position:fixed;top:8px;right:8px;z-index:9998;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid #e7e9ee;border-radius:999px;padding:5px 8px 5px 5px;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#161b22;box-shadow:0 4px 14px rgba(0,0,0,.1);font-family:"Inter",sans-serif;}
  #kensaUserBadge .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#1b5fd6,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;}
  #kensaUserBadge .role{font-size:9px;color:#68707c;font-weight:600;background:#f0f1f4;border-radius:999px;padding:2px 6px;}
  #kensaUserBadge button{border:1px solid #f0d0d0;background:#fff5f5;cursor:pointer;color:#c0392b;font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:999px;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  #kensaUserBadge button:active{transform:scale(.95);}
  #kensaUserBadge button:hover{background:#ffe9e9;}
  #kensaOfflineBadge{display:none;position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9998;background:#161b22;color:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);font-family:"Inter",sans-serif;align-items:center;gap:6px;white-space:nowrap;}
  @media print{ #kensaAuthOverlay, #kensaUserBadge, #kensaOfflineBadge{ display:none !important; } }
</style>
<div id="kensaAuthOverlay">
  <div id="kensaAuthCard">
    <div class="icon">&#128274;</div>
    <h2>&#12525;&#12464;&#12452;&#12531;&#12364;&#24517;&#35201;&#12391;&#12377;</h2>
    <p>&#25285;&#24403;&#32773;PIN&#12434;&#20837;&#21147;&#12375;&#12390;&#12367;&#12384;&#12373;&#12356;</p>
    <input id="kensaAuthPin" type="password" inputmode="numeric" autocomplete="off" placeholder="****" maxlength="10" />
    <button id="kensaAuthBtn" type="button">&#12525;&#12464;&#12452;&#12531;</button>
    <div class="err" id="kensaAuthErr"></div>
    <div class="foot">&#26481;&#20140;&#31934;&#23494;&#30330;&#26465;&#26666;&#24335;&#20250;&#31038;</div>

</div>

  <span class="av" id="kensaUserAvatar">?</span>
  <span id="kensaUserName">-</span>
  <span class="role" id="kensaUserRole"></span>
  <button id="kensaLogoutBtn" title="&#12525;&#12464;&#12450;&#12454;&#12488;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <span>&#12525;&#12464;&#12450;&#12454;&#12488;</span>
  </button>
</div>
<div id="kensaOfflineBadge"></div>
<script>
(function(){
  var AUTH_KEY = 'kensa:session';
  var QUEUE_KEY = 'kensa:offlineQueue';
  var QUEUEABLE_ACTIONS = ['logSave','addScheduleItem','markScheduleDone','deleteScheduleItem','saveShipment'];

  function getSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
  function setSession(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(AUTH_KEY); }
  window.__kensaAuth = { getSession: getSession, setSession: setSession, clearSession: clearSession };

  function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
  function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

  function findGasUrl(){
    if (window.GAS_URL) return window.GAS_URL;
    var m = document.documentElement.innerHTML.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
    return m ? m[0] : null;
  }

  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
      try{
        var body = JSON.parse(opts.body);
        if (body.action !== 'login'){
          var s = getSession();
          body.token = s ? s.token : '';
        }
        opts = Object.assign({}, opts, { body: JSON.stringify(body) });
      }catch(e){}
    }
    return _fetch(url, opts).then(function(res){
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1){
        res.clone().json().then(function(j){
          if (j && j.ok === false && (j.error === 'unauthorized' || j.error === 'session-expired')){
            clearSession(); showGate();
          }
        }).catch(function(){});
      }
      return res;
    }).catch(function(err){
      // Network gagal (offline) — untuk aksi ringan tertentu, antrekan supaya tidak hilang.
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
        try{
          var b = JSON.parse(opts.body);
          if (QUEUEABLE_ACTIONS.indexOf(b.action) !== -1 && opts.body.length < 200000){
            var q = getQueue();
            q.push({ url: url, body: opts.body, ts: Date.now() });
            setQueue(q);
            updateOfflineBadge();
            return new Response(JSON.stringify({ ok:true, queued:true }), { status:200, headers:{'Content-Type':'application/json'} });
          }
        }catch(e){}
      }
      throw err;
    });
  };

  function updateOfflineBadge(){
    var el = document.getElementById('kensaOfflineBadge');
    if (!el) return;
    var q = getQueue();
    if (q.length > 0){
      el.style.display = 'flex';
      el.textContent = (navigator.onLine ? '\u9001\u4fe1\u4e2d\u2026 ' : '\ud83d\udd0c \u30aa\u30d5\u30e9\u30a4\u30f3\u4fdd\u5b58\u4e2d ') + q.length + '\u4ef6';
    } else {
      el.style.display = 'none';
    }
  }

  function flushQueue(){
    var q = getQueue();
    if (q.length === 0) return;
    (function next(){
      var cur = getQueue();
      if (cur.length === 0){ updateOfflineBadge(); return; }
      var item = cur[0];
      _fetch(item.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: item.body })
        .then(function(res){ return res.json().catch(function(){ return {ok:true}; }); })
        .then(function(j){
          var q2 = getQueue();
          q2.shift(); setQueue(q2); updateOfflineBadge();
          if (getQueue().length > 0) next();
        })
        .catch(function(){ updateOfflineBadge(); /* masih offline, coba lagi nanti */ });
    })();
  }
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, 20000);

  function showGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'flex';
    var badge = document.getElementById('kensaUserBadge'); if (badge) badge.style.display = 'none';
    setTimeout(function(){ var i = document.getElementById('kensaAuthPin'); if(i) i.focus(); }, 50);
  }
  function hideGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'none';
  }
  function showUserBadge(s){
    var badge = document.getElementById('kensaUserBadge');
    if (!badge || !s) return;
    document.getElementById('kensaUserName').textContent = s.userName || '\u4e0d\u660e';
    document.getElementById('kensaUserRole').textContent = s.role === 'admin' ? '\u7ba1\u7406\u8005' : '\u30aa\u30da\u30ec\u30fc\u30bf\u30fc';
    document.getElementById('kensaUserAvatar').textContent = (s.userName || '?').slice(0,1);
    badge.style.display = 'flex';
    document.querySelectorAll('.admin-only').forEach(function(el){ el.style.display = (s.role === 'admin') ? '' : 'none'; });
    document.body.setAttribute('data-role', s.role || 'operator');
  }

  function doLogin(){
    var pinInput = document.getElementById('kensaAuthPin');
    var errEl = document.getElementById('kensaAuthErr');
    var btn = document.getElementById('kensaAuthBtn');
    var pin = (pinInput.value || '').trim();
    if (!pin){ errEl.textContent = 'PIN\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'; return; }
    var gasUrl = findGasUrl();
    if (!gasUrl){ errEl.textContent = '\u30d0\u30c3\u30af\u30a8\u30f3\u30c9URL\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093'; return; }
    btn.disabled = true; btn.textContent = '\u78ba\u8a8d\u4e2d\u2026'; errEl.textContent = '';
    _fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'login', pin: pin, deviceName: navigator.userAgent.slice(0,60) }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          var s = { token: data.token, expiresAt: Date.now() + (data.expiresInHours||12) * 3600 * 1000, userName: data.userName, role: data.role };
          setSession(s);
          hideGate();
          location.reload();
        } else {
          errEl.textContent = (data && data.message) || 'PIN\u304c\u9055\u3044\u307e\u3059';
          btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
        }
      })
      .catch(function(){
        errEl.textContent = '\u901a\u4fe1\u30a8\u30e9\u30fc\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
        btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('kensaAuthBtn');
    var pinInput = document.getElementById('kensaAuthPin');
    if (btn) btn.addEventListener('click', doLogin);
    if (pinInput) pinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });
    var logoutBtn = document.getElementById('kensaLogoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', function(){
      if (confirm('\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3059\u304b\uff1f')){ clearSession(); location.reload(); }
    });

    var s = getSession();
    if (!s || !s.token || !s.expiresAt || s.expiresAt < Date.now()){
      clearSession();
      showGate();
    } else {
      showUserBadge(s);
      updateOfflineBadge();
      flushQueue();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

  <div class="bg-glow"></div>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> ポータル</a>
      <div class="theme-toggle" id="themeToggle" title="ダーク/ライト切替">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
    </div>

    <div class="tabs">
      <a href="dashboard.html">📊 品質ダッシュボード</a>
      <a href="dx-report.html">🚀 DXレポート</a>
      <a href="audit-log.html" class="active">📋 監査ログ</a>
    </div>

    <div class="header">
      <div>
        <div class="eyebrow">Audit Log</div>
        <h1>📋 監査ログ</h1>
        <p>誰が・いつ・何を保存/印刷したかをすべて自動記録しています</p>
      </div>
      <button class="export-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        Excel出力
      </button>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-num" id="stTotal">–</div><div class="stat-label">読込件数</div></div>
      <div class="stat-card"><div class="stat-num" id="stSave">–</div><div class="stat-label">SAVE</div></div>
      <div class="stat-card"><div class="stat-num" id="stPrint">–</div><div class="stat-label">PRINT</div></div>
      <div class="stat-card"><div class="stat-num" id="stUsers">–</div><div class="stat-label">担当者数</div></div>
    </div>

    <div class="admin-panel admin-only" style="display:none;">
      <button id="fullExportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        全期間CSV出力（サーバー集計）
      </button>
      <button id="archiveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        12ヶ月以上前をアーカイブ
      </button>
      <button id="backupBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><rect x="3" y="15" width="18" height="6" rx="1"/></svg>
        今すぐバックアップ
      </button>
    </div>

    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="機種・客先・担当者・ファイル名で検索…" autocomplete="off" />
    </div>

    <div id="resultCount" class="result-count"></div>
    <div id="logTable" class="log-table">
      <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
    </div>
    <div id="emptyState" class="empty" style="display:none;">該当するログが見つかりません。</div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      ポータル
    </a>
    <a href="riwayat.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      履歴
    </a>
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
      ダッシュボード
    </a>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    const tableEl = document.getElementById('logTable');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');
    let __debounceTimer = null;
    let __currentRows = [];

    async function apiGAS(body){
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function fmtDate(iso){
      try{ const d = new Date(iso); return d.toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
      catch(e){ return iso || ''; }
    }
    function eventClass(ev){ if (ev === 'SAVE') return 'SAVE'; if (ev === 'PRINT') return 'PRINT'; return 'other'; }

    function render(rows){
      __currentRows = rows;
      countEl.textContent = `${rows.length} 件`;

      const saveCount = rows.filter(r => r.event === 'SAVE').length;
      const printCount = rows.filter(r => r.event === 'PRINT').length;
      const users = new Set(rows.map(r => r.inputter).filter(Boolean));
      document.getElementById('stTotal').textContent = rows.length;
      document.getElementById('stSave').textContent = saveCount;
      document.getElementById('stPrint').textContent = printCount;
      document.getElementById('stUsers').textContent = users.size;

      if (rows.length === 0){ tableEl.innerHTML=''; emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';
      const head = `<div class="log-row head"><span>日時</span><span>種別</span><span>詳細</span><span>担当者</span></div>`;
      const body = rows.map(r => `
        <div class="log-row">
          <span class="log-ts">${fmtDate(r.timestamp)}</span>
          <span class="log-event ${eventClass(r.event)}">${r.event || '—'}</span>
          <span class="log-detail">${r.customer || '—'}<br><span class="sub">${r.file_name || r.app_ns || ''}</span></span>
          <span class="log-user">${r.inputter || '—'}</span>
        </div>
      `).join('');
      tableEl.innerHTML = head + body;
    }

    async function load(query){
      try{
        const res = await apiGAS({ action:'getAuditLog', query: query || '', limit: 150 });
        const rows = (res && res.ok && Array.isArray(res.rows)) ? res.rows : [];
        render(rows);
      }catch(e){
        tableEl.innerHTML = '';
        countEl.textContent = '';
        emptyEl.style.display = 'block';
        emptyEl.textContent = '読み込みに失敗しました — ' + (e.message||e);
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(__debounceTimer);
      __debounceTimer = setTimeout(() => load(searchInput.value.trim()), 400);
    });

    /* ---------- Excel(CSV) 出力 ---------- */
    function csvEscape(v){
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!__currentRows.length){ showToast('出力するデータがありません'); return; }
      const headers = ['日時','種別','客先','ファイル名','担当者','判定','app_ns'];
      const lines = [headers.join(',')];
      __currentRows.forEach(r => {
        lines.push([
          csvEscape(fmtDate(r.timestamp)), csvEscape(r.event), csvEscape(r.customer),
          csvEscape(r.file_name), csvEscape(r.inputter), csvEscape(r.judgment), csvEscape(r.app_ns)
        ].join(','));
      });
      const csv = '\uFEFF' + lines.join('\r\n'); // BOM付きでExcelの文字化け防止
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
      a.href = url; a.download = `監査ログ_${ymd}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      showToast(`✅ ${__currentRows.length}件をCSV出力しました`);
    });

    /* ---------- 管理者専用: 全期間CSV出力（サーバー側で全件集計） ---------- */
    document.getElementById('fullExportBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('fullExportBtn');
      btn.disabled = true;
      try{
        const res = await apiGAS({ action:'exportCsv', sheet:'Logs', sinceDays:0 });
        if (!res || !res.ok) throw new Error(res?.message || 'エクスポートに失敗しました');
        const blob = new Blob(['\uFEFF' + res.csv], { type:'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = res.filename || 'logs.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showToast('✅ 全期間のCSVを出力しました');
      }catch(e){ showToast('⚠️ ' + (e.message || e)); }
      finally{ btn.disabled = false; }
    });

    /* ---------- 管理者専用: 古いログをアーカイブ ---------- */
    document.getElementById('archiveBtn')?.addEventListener('click', async () => {
      if (!confirm('12ヶ月以上前のログを「Logs_Archive」シートに移動します。よろしいですか？')) return;
      const btn = document.getElementById('archiveBtn');
      btn.disabled = true;
      try{
        const res = await apiGAS({ action:'archiveOldLogs', monthsOld:12 });
        if (!res || !res.ok) throw new Error(res?.message || 'アーカイブに失敗しました');
        showToast(`✅ ${res.archived}件をアーカイブしました`);
        load(searchInput.value.trim());
      }catch(e){ showToast('⚠️ ' + (e.message || e)); }
      finally{ btn.disabled = false; }
    });

    /* ---------- 管理者専用: 手動バックアップ ---------- */
    document.getElementById('backupBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('backupBtn');
      btn.disabled = true;
      try{
        const res = await apiGAS({ action:'runManualBackup' });
        if (!res || !res.ok) throw new Error(res?.message || 'バックアップに失敗しました');
        showToast(`✅ バックアップ完了: ${res.fileName}`);
      }catch(e){ showToast('⚠️ ' + (e.message || e)); }
      finally{ btn.disabled = false; }
    });

    load('');
  </script>
</body>
