<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>検査履歴 — 出荷検査成績書</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#0a8ffc" />
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1b5fd6; --accent-2:#3b82f6; --ink:#161b22; --sub:#68707c; --line:#e7e9ee;
    --bg-1:#eef2f8; --bg-2:#e4ebf6; --card:#ffffff;
    --pass:#1d8a4a; --pass-bg:#e7f7ee; --fail:#c62828; --fail-bg:#fdecea;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.04);
    --shadow-md:0 8px 24px rgba(20,30,60,.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background: radial-gradient(1100px 500px at 12% -10%, #dbe7fb 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #e7f0ff 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:28px 20px 70px; }
  .topnav{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .topnav a{ color:var(--accent); text-decoration:none; font-weight:600; font-size:13.5px; }
  .header{ text-align:center; padding:6px 0 22px; }
  .header h1{ font-size:21px; font-weight:800; margin:0 0 6px; }
  .header p{ margin:0; color:var(--sub); font-size:13px; font-weight:500; }

  .search-input-wrap{ position:relative; margin-bottom:14px; }
  .search-input-wrap input{
    width:100%; font-family:inherit; font-size:15.5px; font-weight:500;
    padding:15px 16px 15px 46px; border-radius:16px; border:1px solid var(--line);
    background:var(--card); box-shadow:var(--shadow-sm); outline:none;
  }
  .search-input-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px rgba(27,95,214,.12); }
  .search-icon{ position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; opacity:.45; }

  .result-count{ font-size:12px; font-weight:600; color:var(--sub); margin:6px 4px 10px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{
    display:block; background:var(--card); border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow-sm); border:1px solid var(--line); text-decoration:none; color:inherit;
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .card-row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-customer{ font-size:11.5px; font-weight:600; color:var(--accent); margin-bottom:3px; }
  .card-title{ font-size:15px; font-weight:700; }
  .card-sub{ font-size:12.5px; color:var(--sub); margin-top:3px; }
  .badge{ flex:0 0 auto; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .badge.pass{ color:var(--pass); background:var(--pass-bg); }
  .badge.fail{ color:var(--fail); background:var(--fail-bg); }
  .badge.unknown{ color:var(--sub); background:#f1f3f6; }
  .no-link{ font-size:11px; color:#b6bcc6; margin-top:6px; }

  .empty{ text-align:center; color:var(--sub); padding:60px 10px; font-size:14px; }
  .empty .big{ font-size:34px; margin-bottom:10px; opacity:.7; }
  .footer{ text-align:center; margin-top:44px; font-size:11.5px; color:var(--sub); font-weight:500; letter-spacing:.02em; }
  .loading{ text-align:center; color:var(--sub); padding:40px 10px; font-size:13.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="index.html">← ポータルに戻る</a></div>
    <div class="header">
      <h1>📚 検査履歴</h1>
      <p>過去に保存された出荷検査成績書を検索します</p>
    </div>

    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="客先・品名・製造No・図番・入力者で検索…" autocomplete="off" />
    </div>

    <div id="resultCount" class="result-count"></div>
    <div id="list" class="list"></div>
    <div id="loadingState" class="loading">読み込み中…</div>
    <div id="emptyState" class="empty" style="display:none;">
      <div class="big">📭</div>
      該当する履歴が見つかりません。
    </div>
    <div class="footer">© 東京精密発條株式会社 All Rights Reserved　／　Design by Wahyu</div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('emptyState');
    const loadingEl = document.getElementById('loadingState');
    const countEl = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');

    let __allRows = [];
    let __debounceTimer = null;

    async function apiGAS(body){
      if (GAS_URL.includes('GANTI_DENGAN')) throw new Error('GAS_URL belum diatur di riwayat.html');
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function fmtDate(iso){
      try{ const d = new Date(iso); return d.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
      catch(e){ return iso || ''; }
    }

    function judgeBadge(j){
      if (j === '合格') return `<span class="badge pass">合格</span>`;
      if (j === '否') return `<span class="badge fail">否</span>`;
      return `<span class="badge unknown">未判定</span>`;
    }

    function render(rows){
      listEl.innerHTML = '';
      countEl.textContent = `${rows.length} 件`;
      if (rows.length === 0){ emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';
      rows.forEach(row => {
        const el = document.createElement(row.file_url ? 'a' : 'div');
        el.className = 'card';
        if (row.file_url) { el.href = row.file_url; el.target = '_blank'; el.rel = 'noopener'; }
        el.innerHTML = `
          <div class="card-row1">
            <div>
              <div class="card-customer">${row.customer || '—'}</div>
              <div class="card-title">${row.hinmei || '—'} ／ ${row.serial_full || '—'}</div>
              <div class="card-sub">${fmtDate(row.timestamp)} ・ 入力: ${row.inputter || '—'}</div>
            </div>
            ${judgeBadge(row.judgment)}
          </div>
          ${row.file_url ? '' : '<div class="no-link">PDFリンクなし</div>'}
        `;
        listEl.appendChild(el);
      });
    }

    function applyFilter(){
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { render(__allRows); return; }
      render(__allRows.filter(r =>
        `${r.customer} ${r.hinmei} ${r.serial_full} ${r.inputter}`.toLowerCase().includes(q)
      ));
    }

    async function loadFromServer(query){
      loadingEl.style.display = 'block';
      emptyEl.style.display = 'none';
      try{
        const res = await apiGAS({ action:'searchLogs', query: query || '', limit: 100 });
        __allRows = (res && res.ok && Array.isArray(res.rows)) ? res.rows : [];
        render(__allRows);
      }catch(e){
        listEl.innerHTML = '';
        countEl.textContent = '';
        emptyEl.style.display = 'block';
        emptyEl.querySelector('.big').nextSibling && (emptyEl.innerHTML = `<div class="big">⚠️</div>読み込みに失敗しました。<br>${(e.message||e)}`);
      }finally{
        loadingEl.style.display = 'none';
      }
    }

    searchInput.addEventListener('input', () => {
      // Filter dulu dari data yang sudah dimuat (cepat), lalu request ulang ke server
      // supaya hasil pencarian tidak terbatas hanya 100 baris terakhir.
      applyFilter();
      clearTimeout(__debounceTimer);
      __debounceTimer = setTimeout(() => loadFromServer(searchInput.value.trim()), 500);
    });

    loadFromServer('');
    searchInput.focus();
  </script>
</body>
</html>
