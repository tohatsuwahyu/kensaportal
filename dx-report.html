<style>
  :root{
    --ink:#14181f; --ink-soft:#3d4451; --sub:#6b7280; --faint:#a5abb6;
    --line:#e7e9ee; --line-soft:#f0f1f4; --bg:#f5f6f9; --card:#ffffff; --card-2:#fbfbfd;
    --accent:#2451c4; --accent-2:#4d7cf0; --accent-soft:#eef2fc;
    --green:#0f8a53; --green-bg:#e6f7ee;
    --purple:#7c3aed; --purple-bg:#f3edfd;
    --amber:#b8860b; --amber-bg:#fff6e0;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(15,20,35,.04), 0 1px 1px rgba(15,20,35,.03);
    --shadow-md:0 10px 30px rgba(15,20,35,.08);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --ink:#eef1f6; --ink-soft:#c7cdd8; --sub:#8b93a3; --faint:#5c6472;
    --line:#242a35; --line-soft:#1b2029; --bg:#0b0e14; --card:#12161f; --card-2:#151a24;
    --accent:#5b8cff; --accent-2:#7ba2ff; --accent-soft:#182240;
    --green:#2fd88a; --green-bg:#0f2a1e;
    --purple:#a78bfa; --purple-bg:#241a3d;
    --amber:#f0c04a; --amber-bg:#2b2311;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;
  }
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.7;
    background:
      radial-gradient(700px 380px at 15% -8%, rgba(124,58,237,.14), transparent 60%),
      radial-gradient(600px 340px at 105% 8%, rgba(77,124,240,.14), transparent 55%);
  }
  html[data-theme="dark"] .bg-glow{ opacity:1; }
  .wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:28px 20px calc(100px + env(safe-area-inset-bottom)); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .topbar a{ color:var(--sub); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
  .topbar a svg{ width:15px; height:15px; }
  .theme-toggle{ width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); box-shadow:var(--shadow-sm); }
  .theme-toggle svg{ width:16px; height:16px; }

  .tabs{ display:flex; gap:6px; margin-bottom:26px; padding:4px; background:var(--card-2); border:1px solid var(--line); border-radius:13px; }
  .tabs a{ flex:1; text-align:center; padding:9px 10px; border-radius:10px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--sub); transition:all .15s ease; }
  .tabs a.active{ background:linear-gradient(135deg,var(--purple),#a78bfa); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,.35); }

  .header{ margin-bottom:24px; }
  .header .eyebrow{ font-size:11px; font-weight:700; color:var(--purple); letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; }
  .header h1{ font-size:24px; font-weight:800; margin:0; letter-spacing:-.02em; }
  .header p{ margin:6px 0 0; color:var(--sub); font-size:13px; }

  .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .metric{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px; box-shadow:var(--shadow-sm); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; }
  .metric:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .metric::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--m-color, var(--purple)), transparent); }
  .metric-icon{ width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .metric-icon svg{ width:15px; height:15px; }
  .metric.c1 .metric-icon{ background:var(--accent-soft); color:var(--accent); }
  .metric.c2 .metric-icon{ background:var(--green-bg); color:var(--green); }
  .metric.c3 .metric-icon{ background:var(--purple-bg); color:var(--purple); }
  .metric.c4 .metric-icon{ background:var(--amber-bg); color:var(--amber); }
  .metric-value{ font-family:var(--mono); font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .metric-label{ font-size:10.5px; color:var(--sub); font-weight:700; margin-top:5px; text-transform:uppercase; letter-spacing:.04em; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
  .panel-title{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
  .panel-title .trend-chip{ font-family:var(--mono); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:none; letter-spacing:0; }
  .panel-title .trend-chip.up{ color:var(--green); background:var(--green-bg); }
  .panel-title .trend-chip.down{ color:#d33; background:#fdecec; }

  .chart-wrap{ position:relative; margin-top:14px; }
  .chart-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-line{ stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.4s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .chart-area{ opacity:0; animation:fadein 1s ease .3s forwards; }
  @keyframes fadein{ to{ opacity:1; } }
  .chart-dot{ opacity:0; animation:popin .4s ease forwards; }
  @keyframes popin{ from{ opacity:0; transform:scale(0); } to{ opacity:1; transform:scale(1); } }
  .chart-months{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:8px; }

  .info-note{ font-size:12.5px; color:var(--sub); line-height:1.8; }
  .info-note b{ color:var(--ink-soft); }
  .info-note .kw{ color:var(--purple); font-weight:700; }

  .skeleton{ background:linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around; align-items:center; background:rgba(255,255,255,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(15,20,35,.06); }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.88); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }

  @media (max-width:640px){ .metrics{ grid-template-columns:repeat(2,1fr); } }
</style>

<script>
(function(){
  var AUTH_KEY = 'kensa:session';
  function getSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
  function setSession(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(AUTH_KEY); }
  window.__kensaAuth = { getSession: getSession, setSession: setSession, clearSession: clearSession };

  function findGasUrl(){
    if (window.GAS_URL) return window.GAS_URL;
    var m = document.documentElement.innerHTML.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
    return m ? m[0] : null;
  }

  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
      try{
        var body = JSON.parse(opts.body);
        if (body.action !== 'login'){
          var s = getSession();
          body.token = s ? s.token : '';
        }
        opts = Object.assign({}, opts, { body: JSON.stringify(body) });
      }catch(e){}
    }
    return _fetch(url, opts).then(function(res){
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1){
        res.clone().json().then(function(j){
          if (j && j.ok === false && (j.error === 'unauthorized' || j.error === 'session-expired')){
            clearSession(); showGate();
          }
        }).catch(function(){});
      }
      return res;
    });
  };

  function showGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'flex';
    setTimeout(function(){ var i = document.getElementById('kensaAuthPin'); if(i) i.focus(); }, 50);
  }
  function hideGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'none';
  }

  function doLogin(){
    var pinInput = document.getElementById('kensaAuthPin');
    var errEl = document.getElementById('kensaAuthErr');
    var btn = document.getElementById('kensaAuthBtn');
    var pin = (pinInput.value || '').trim();
    if (!pin){ errEl.textContent = 'PIN\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'; return; }
    var gasUrl = findGasUrl();
    if (!gasUrl){ errEl.textContent = '\u30d0\u30c3\u30af\u30a8\u30f3\u30c9URL\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093'; return; }
    btn.disabled = true; btn.textContent = '\u78ba\u8a8d\u4e2d\u2026'; errEl.textContent = '';
    _fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'login', pin: pin, deviceName: navigator.userAgent.slice(0,60) }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          setSession({ token: data.token, expiresAt: Date.now() + (data.expiresInHours||12) * 3600 * 1000 });
          hideGate();
          location.reload();
        } else {
          errEl.textContent = (data && data.message) || 'PIN\u304c\u9055\u3044\u307e\u3059';
          btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
        }
      })
      .catch(function(){
        errEl.textContent = '\u901a\u4fe1\u30a8\u30e9\u30fc\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
        btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('kensaAuthBtn');
    var pinInput = document.getElementById('kensaAuthPin');
    if (btn) btn.addEventListener('click', doLogin);
    if (pinInput) pinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });

    var s = getSession();
    if (!s || !s.token || !s.expiresAt || s.expiresAt < Date.now()){
      clearSession();
      showGate();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    function countUp(el, target, duration=800){
      const start = performance.now();
      function step(now){
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    async function apiGAS(body){
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    // Kurva halus (Catmull-Rom -> Bezier) supaya grafik tidak patah-patah
    function smoothPath(points){
      if (points.length < 2) return '';
      let d = `M${points[0][0]},${points[0][1]}`;
      for (let i=0; i<points.length-1; i++){
        const p0 = points[i-1] || points[i];
        const p1 = points[i];
        const p2 = points[i+1];
        const p3 = points[i+2] || p2;
        const cp1x = p1[0] + (p2[0]-p0[0])/6, cp1y = p1[1] + (p2[1]-p0[1])/6;
        const cp2x = p2[0] - (p3[0]-p1[0])/6, cp2y = p2[1] - (p3[1]-p1[1])/6;
        d += ` C${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0]},${p2[1]}`;
      }
      return d;
    }

    function lineChartSVG(trend){
      const w = 800, h = 230, padL = 34, padR = 10, padT = 20, padB = 26;
      const max = Math.max(10, ...trend.map(t => t.count));
      const stepX = (w - padL - padR) / (trend.length - 1 || 1);
      const yFor = v => padT + (h - padT - padB) * (1 - v / max);
      const xFor = i => padL + stepX * i;
      const points = trend.map((t,i) => [xFor(i), yFor(t.count)]);

      const linePath = smoothPath(points);
      const areaPath = linePath + ` L${points[points.length-1][0].toFixed(1)},${h-padB} L${points[0][0].toFixed(1)},${h-padB} Z`;

      const gridLines = [0,0.25,0.5,0.75,1].map(f => {
        const y = padT + (h-padT-padB)*f;
        const val = Math.round(max*(1-f));
        return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line-soft)" stroke-width="1"/>
                <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--faint)" font-family="JetBrains Mono, monospace">${val}</text>`;
      }).join('');

      const dots = points.map((p,i) => `<circle class="chart-dot" style="animation-delay:${1.1 + i*0.08}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--purple)" stroke="var(--card)" stroke-width="2"/>`).join('');

      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--purple)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--purple)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridLines}
        <path class="chart-area" d="${areaPath}" fill="url(#areaGrad)"/>
        <path class="chart-line" d="${linePath}" fill="none" stroke="var(--purple)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>`;
    }

    function render(r){
      const trend = r.monthlyTrend || [];
      const thisMonth = trend.length ? trend[trend.length-1].count : 0;
      const lastMonth = trend.length > 1 ? trend[trend.length-2].count : 0;
      let trendChip = '';
      if (lastMonth > 0){
        const pct = Math.round(((thisMonth - lastMonth) / lastMonth) * 100);
        const up = pct >= 0;
        trendChip = `<span class="trend-chip ${up?'up':'down'}">${up?'↑':'↓'} ${Math.abs(pct)}% vs前月</span>`;
      }

      document.getElementById('content').innerHTML = `
        <div class="metrics">
          <div class="metric c1" style="--m-color:var(--accent);">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
            <div class="metric-value" id="mv1">0</div>
            <div class="metric-label">登録検査総数</div>
          </div>
          <div class="metric c2" style="--m-color:var(--green);">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="metric-value" id="mv2">0</div>
            <div class="metric-label">合格件数</div>
          </div>
          <div class="metric c3" style="--m-color:var(--purple);">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></div>
            <div class="metric-value" id="mv3">0</div>
            <div class="metric-label">QR証明書発行数</div>
          </div>
          <div class="metric c4" style="--m-color:var(--amber);">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
            <div class="metric-value" id="mv4">0</div>
            <div class="metric-label">システム利用者数</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title"><span>月間システム操作数の推移</span>${trendChip}</div>
          <div class="chart-wrap">${lineChartSVG(trend)}</div>
          <div class="chart-months">${trend.map(t=>`<span>${t.month}</span>`).join('')}</div>
        </div>

        <div class="panel">
          <div class="panel-title">このレポートについて</div>
          <div class="info-note">
            紙媒体の出荷検査記録を廃止し、本システムへ完全移行したことによるDX推進の成果を可視化しています。<br><br>
            <span class="kw">登録検査総数</span>：本システムで保存された検査記録の累計件数<br>
            <span class="kw">QR証明書発行数</span>：真正性検証QRコード付きで発行されたPDF証明書の件数<br>
            <span class="kw">システム利用者数</span>：過去に検査を入力した担当者の実人数<br><br>
            本レポートは DX認定制度 申請における設問(2)②・(3) の裏付け資料としてもご活用いただけます。
          </div>
        </div>
      `;

      countUp(document.getElementById('mv1'), r.totalRecords || 0);
      countUp(document.getElementById('mv2'), r.passCount || 0);
      countUp(document.getElementById('mv3'), r.issuedCertificates || 0);
      countUp(document.getElementById('mv4'), r.activeUsers || 0);
    }

    async function load(){
      try{
        const res = await apiGAS({ action:'getDxReport' });
        if (res && res.ok) render(res);
        else throw new Error(res && res.message || '取得に失敗しました');
      }catch(e){
        document.getElementById('content').innerHTML = `<div class="panel">⚠️ 読み込みに失敗しました — ${(e.message||e)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
