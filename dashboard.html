<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ダッシュボード — 出荷検査成績書</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#0a8ffc" />
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1b5fd6; --accent-2:#3b82f6; --ink:#161b22; --sub:#68707c; --line:#e7e9ee;
    --bg-1:#eef2f8; --bg-2:#e4ebf6; --card:#ffffff;
    --pass:#1d8a4a; --pass-bg:#e7f7ee; --fail:#c62828; --fail-bg:#fdecea;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.04);
    --shadow-md:0 8px 24px rgba(20,30,60,.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background: radial-gradient(1100px 500px at 12% -10%, #dbe7fb 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #e7f0ff 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:28px 20px 70px; }
  .topnav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .topnav a{ color:var(--accent); text-decoration:none; font-weight:600; font-size:13.5px; }
  .header{ text-align:center; padding:6px 0 20px; }
  .header h1{ font-size:21px; font-weight:800; margin:0 0 6px; }
  .header p{ margin:0; color:var(--sub); font-size:13px; font-weight:500; }

  .range-chips{ display:flex; gap:8px; justify-content:center; margin-bottom:22px; }
  .chip{ padding:7px 15px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:600; color:var(--sub); cursor:pointer; box-shadow:var(--shadow-sm); }
  .chip.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .stat-card{ background:var(--card); border-radius:16px; padding:18px 14px; text-align:center; box-shadow:var(--shadow-sm); border:1px solid var(--line); }
  .stat-num{ font-size:26px; font-weight:800; }
  .stat-label{ font-size:11.5px; color:var(--sub); font-weight:600; margin-top:2px; }
  .stat-card.pass .stat-num{ color:var(--pass); }
  .stat-card.fail .stat-num{ color:var(--fail); }

  .rate-bar-wrap{ background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); margin-bottom:24px; }
  .rate-bar-label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--sub); margin-bottom:8px; }
  .rate-bar{ height:12px; border-radius:999px; background:var(--fail-bg); overflow:hidden; }
  .rate-bar-fill{ height:100%; background:linear-gradient(90deg,var(--pass),#3fb96a); border-radius:999px; transition:width .3s ease; }

  .section-title{ font-size:14px; font-weight:700; margin:22px 4px 10px; }
  .table-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow-sm); border:1px solid var(--line); overflow:hidden; }
  .table-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 16px; font-size:13.5px; border-bottom:1px solid var(--line); }
  .table-row:last-child{ border-bottom:none; }
  .table-row .name{ font-weight:600; }
  .table-row .count{ color:var(--sub); font-weight:600; font-size:12.5px; }

  .empty{ text-align:center; color:var(--sub); padding:50px 10px; font-size:13.5px; }
  .loading{ text-align:center; color:var(--sub); padding:50px 10px; font-size:13.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="index.html">← ポータルに戻る</a></div>
    <div class="header">
      <h1>📊 ダッシュボード</h1>
      <p>検査結果の集計（Logsシートから自動集計）</p>
    </div>

    <div class="range-chips" id="rangeChips">
      <div class="chip" data-days="7">7日間</div>
      <div class="chip active" data-days="30">30日間</div>
      <div class="chip" data-days="90">90日間</div>
    </div>

    <div id="content">
      <div class="loading" id="loadingState">読み込み中…</div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    async function apiGAS(body){
      if (GAS_URL.includes('GANTI_DENGAN')) throw new Error('GAS_URL belum diatur di dashboard.html');
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function renderTable(rows, emptyMsg){
      if (!rows || rows.length === 0) return `<div class="table-card"><div class="table-row"><span class="name" style="color:#9aa2ad;">${emptyMsg}</span></div></div>`;
      return `<div class="table-card">` + rows.slice(0, 10).map(r =>
        `<div class="table-row"><span class="name">${r.name}</span><span class="count">${r.count} 件</span></div>`
      ).join('') + `</div>`;
    }

    function render(stats){
      const total = stats.total || 0;
      const pass = stats.pass || 0;
      const fail = stats.fail || 0;
      const judged = pass + fail;
      const rate = judged > 0 ? Math.round((pass / judged) * 100) : 0;

      document.getElementById('content').innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">総検査数</div></div>
          <div class="stat-card pass"><div class="stat-num">${pass}</div><div class="stat-label">合格</div></div>
          <div class="stat-card fail"><div class="stat-num">${fail}</div><div class="stat-label">否</div></div>
        </div>
        <div class="rate-bar-wrap">
          <div class="rate-bar-label"><span>合格率</span><span>${rate}%</span></div>
          <div class="rate-bar"><div class="rate-bar-fill" style="width:${rate}%;"></div></div>
        </div>
        <div class="section-title">客先別 件数</div>
        ${renderTable(stats.byCustomer, 'データがありません')}
        <div class="section-title">入力者別 件数</div>
        ${renderTable(stats.byInputter, 'データがありません')}
      `;
    }

    async function load(days){
      document.getElementById('content').innerHTML = '<div class="loading">読み込み中…</div>';
      try{
        const res = await apiGAS({ action:'getDashboardStats', sinceDays: days });
        if (res && res.ok) render(res);
        else throw new Error(res && res.message || '取得に失敗しました');
      }catch(e){
        document.getElementById('content').innerHTML = `<div class="empty">⚠️ 読み込みに失敗しました<br>${(e.message||e)}</div>`;
      }
    }

    document.querySelectorAll('#rangeChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        load(Number(chip.dataset.days));
      });
    });

    load(30);
  </script>
</body>
</html>
