<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ダッシュボード — 出荷検査成績書</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --ink-soft:#3d4451; --sub:#6b7280; --faint:#a5abb6;
    --line:#e7e9ee; --line-soft:#f0f1f4; --bg:#f5f6f9; --card:#ffffff; --card-2:#fbfbfd;
    --accent:#2451c4; --accent-2:#4d7cf0; --accent-soft:#eef2fc;
    --green:#0f8a53; --green-bg:#e6f7ee;
    --fail:#d33; --fail-bg:#fdecec;
    --amber:#b8860b; --amber-bg:#fff6e0;
    --purple:#7c3aed; --purple-bg:#f3edfd;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --shadow-sm:0 1px 2px rgba(15,20,35,.04), 0 1px 1px rgba(15,20,35,.03);
    --shadow-md:0 10px 30px rgba(15,20,35,.08);
    --shadow-glow:0 0 0 1px rgba(36,81,196,.08), 0 12px 32px rgba(36,81,196,.12);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --ink:#eef1f6; --ink-soft:#c7cdd8; --sub:#8b93a3; --faint:#5c6472;
    --line:#242a35; --line-soft:#1b2029; --bg:#0b0e14; --card:#12161f; --card-2:#151a24;
    --accent:#5b8cff; --accent-2:#7ba2ff; --accent-soft:#182240;
    --green:#2fd88a; --green-bg:#0f2a1e;
    --fail:#ff6b6b; --fail-bg:#2c1414;
    --amber:#f0c04a; --amber-bg:#2b2311;
    --purple:#a78bfa; --purple-bg:#241a3d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
    --shadow-glow:0 0 0 1px rgba(91,140,255,.15), 0 0 40px rgba(91,140,255,.1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.7;
    background:
      radial-gradient(700px 380px at 15% -8%, rgba(77,124,240,.16), transparent 60%),
      radial-gradient(600px 340px at 105% 8%, rgba(124,58,237,.12), transparent 55%);
  }
  html[data-theme="dark"] .bg-glow{ opacity:1; }

  .wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:28px 20px calc(100px + env(safe-area-inset-bottom)); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .topbar .back-btn{ color:var(--sub); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
  .topbar .back-btn svg{ width:15px; height:15px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .updated{ font-size:10.5px; color:var(--faint); font-family:var(--mono); }
  .theme-toggle{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
    box-shadow:var(--shadow-sm); transition:transform .15s ease;
  }
  .theme-toggle:active{ transform:scale(.9); }
  .theme-toggle svg{ width:16px; height:16px; }

  .tabs{ display:flex; gap:6px; margin-bottom:26px; padding:4px; background:var(--card-2); border:1px solid var(--line); border-radius:13px; }
  .tabs a{ flex:1; text-align:center; padding:9px 10px; border-radius:10px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--sub); transition:all .15s ease; }
  .tabs a.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 4px 14px rgba(36,81,196,.35); }

  .header{ margin-bottom:24px; }
  .header .eyebrow{ font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; display:flex; align-items:center; gap:7px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--green-bg); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  .header h1{ font-size:24px; font-weight:800; margin:0; letter-spacing:-.02em; }
  .header p{ margin:6px 0 0; color:var(--sub); font-size:13px; }

  .range-tabs{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:11px; padding:3px; margin-bottom:22px; box-shadow:var(--shadow-sm); }
  .range-tabs .tab{ padding:7px 17px; font-size:12.5px; font-weight:600; color:var(--sub); border-radius:8px; cursor:pointer; transition:all .15s ease; }
  .range-tabs .tab.active{ background:var(--ink); color:var(--bg); }

  .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .metric{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; box-shadow:var(--shadow-sm); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease;
  }
  .metric:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .metric::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--m-color, var(--accent)), transparent);
  }
  .metric-label{ font-size:10.5px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
  .metric-value{ font-family:var(--mono); font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .metric-value.pass{ color:var(--green); }
  .metric-value.fail{ color:var(--fail); }
  .metric-trend{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; margin-top:9px; padding:3px 8px; border-radius:999px; }
  .metric-trend.up{ color:var(--green); background:var(--green-bg); }
  .metric-trend.down{ color:var(--fail); background:var(--fail-bg); }
  .metric-trend.flat{ color:var(--sub); background:var(--line-soft); }
  .metric-trend svg{ width:10px; height:10px; }

  .panel-row{ display:grid; grid-template-columns:1fr 1.35fr; gap:14px; margin-bottom:14px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); }
  .panel-title{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:18px; display:flex; align-items:center; gap:7px; }
  .panel-title svg{ width:14px; height:14px; color:var(--accent); }

  .ring-wrap{ display:flex; align-items:center; gap:20px; }
  .ring-legend{ font-size:12px; color:var(--sub); }
  .ring-legend .row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ring-legend .dot{ width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
  .ring-legend b{ color:var(--ink); font-family:var(--mono); }

  .bars{ display:flex; flex-direction:column; gap:12px; }
  .bar-row{ display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:10px; }
  .bar-row .name{ font-size:12px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:8px; border-radius:5px; background:var(--line-soft); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:0; transition:width 1s cubic-bezier(.16,1,.3,1); }
  .bar-row .count{ font-family:var(--mono); font-size:11px; color:var(--faint); text-align:right; }

  .table-list .row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .table-list .row:last-child{ border-bottom:none; }
  .table-list .name{ color:var(--ink-soft); font-weight:600; }
  .table-list .count{ font-family:var(--mono); color:var(--faint); }

  .empty-note{ color:var(--faint); font-size:12.5px; padding:10px 0; }

  .skeleton{ background:linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }

  .footer{ text-align:center; margin-top:30px; font-size:11px; color:var(--faint); font-weight:500; letter-spacing:.02em; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,255,255,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(15,20,35,.06);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.88); }

  @media (max-width:640px){
    .metrics{ grid-template-columns:repeat(2,1fr); }
    .panel-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> ポータル</a>
      <div class="topbar-right">
        <span class="updated" id="updatedAt"></span>
        <div class="theme-toggle" id="themeToggle" title="ダーク/ライト切替">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
      </div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="active">📊 品質ダッシュボード</a>
      <a href="dx-report.html">🚀 DXレポート</a>
      <a href="audit-log.html">📋 監査ログ</a>
    </div>

    <div class="header">
      <div class="eyebrow"><span class="live-dot"></span>Quality Overview</div>
      <h1>出荷検査ダッシュボード</h1>
      <p>Logsシートから自動集計された検査結果サマリー</p>
    </div>

    <div class="range-tabs" id="rangeTabs">
      <div class="tab" data-days="7">7日</div>
      <div class="tab active" data-days="30">30日</div>
      <div class="tab" data-days="90">90日</div>
    </div>

    <div id="content">
      <div class="metrics">
        <div class="metric"><div class="skeleton" style="height:44px;"></div></div>
        <div class="metric"><div class="skeleton" style="height:44px;"></div></div>
        <div class="metric"><div class="skeleton" style="height:44px;"></div></div>
        <div class="metric"><div class="skeleton" style="height:44px;"></div></div>
      </div>
    </div>

    <div class="footer">© 東京精密発條株式会社 All Rights Reserved　／　Design by Wahyu</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      ポータル
    </a>
    <a href="riwayat.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      履歴
    </a>
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
      ダッシュボード
    </a>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    /* ---------- Dark mode ---------- */
    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    /* ---------- Count-up animation ---------- */
    function countUp(el, target, duration=800){
      const start = performance.now();
      const from = 0;
      function step(now){
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (target - from) * eased);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    async function apiGAS(body){
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function ringSVG(rate){
      const r = 44, c = 2*Math.PI*r;
      const color = rate >= 90 ? 'var(--green)' : (rate >= 70 ? 'var(--amber)' : 'var(--fail)');
      return `
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="10"/>
          <circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="10"
            stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round"
            transform="rotate(-90 55 55)" id="ringProgress" data-offset="${c * (1 - rate/100)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);"/>
          <text x="55" y="51" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="21" font-weight="700" fill="var(--ink)">${rate}%</text>
          <text x="55" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="var(--sub)">合格率</text>
        </svg>`;
    }

    function trendBadge(current, prev){
      if (!prev){ return `<span class="metric-trend flat">— データ不足</span>`; }
      const diff = current - prev;
      const pct = Math.round((diff / prev) * 100);
      if (diff === 0) return `<span class="metric-trend flat">→ 変化なし</span>`;
      const up = diff > 0;
      const arrow = up ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M19 12l-7 7-7-7"/>';
      return `<span class="metric-trend ${up?'up':'down'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${arrow}</svg>${Math.abs(pct)}% vs前期間</span>`;
    }

    function renderBars(rows){
      if (!rows || rows.length === 0) return `<div class="empty-note">データがありません</div>`;
      const max = Math.max(...rows.slice(0,8).map(r=>r.count));
      const html = `<div class="bars">` + rows.slice(0,8).map(r => `
        <div class="bar-row">
          <span class="name" title="${r.name}">${r.name}</span>
          <div class="bar-track"><div class="bar-fill" data-w="${Math.round((r.count/max)*100)}"></div></div>
          <span class="count">${r.count}</span>
        </div>`).join('') + `</div>`;
      return html;
    }
    function renderList(rows){
      if (!rows || rows.length === 0) return `<div class="empty-note">データがありません</div>`;
      return `<div class="table-list">` + rows.slice(0,8).map(r => `
        <div class="row"><span class="name">${r.name}</span><span class="count">${r.count} 件</span></div>
      `).join('') + `</div>`;
    }

    function render(stats){
      const total = stats.total || 0, pass = stats.pass || 0, fail = stats.fail || 0;
      const unjudged = Math.max(0, total - pass - fail);
      const judged = pass + fail;
      const rate = judged > 0 ? Math.round((pass / judged) * 100) : 0;
      const prevTotal = stats.prevTotal || 0;
      const prevPass = stats.prevPass || 0;

      document.getElementById('content').innerHTML = `
        <div class="metrics">
          <div class="metric" style="--m-color:var(--accent);">
            <div class="metric-label">総検査数</div>
            <div class="metric-value" id="mvTotal">0</div>
            ${trendBadge(total, prevTotal)}
          </div>
          <div class="metric" style="--m-color:var(--green);">
            <div class="metric-label">合格</div>
            <div class="metric-value pass" id="mvPass">0</div>
            ${trendBadge(pass, prevPass)}
          </div>
          <div class="metric" style="--m-color:var(--fail);">
            <div class="metric-label">否</div>
            <div class="metric-value fail" id="mvFail">0</div>
            <span class="metric-trend flat">${judged>0?Math.round(fail/judged*100):0}% of judged</span>
          </div>
          <div class="metric" style="--m-color:var(--sub);">
            <div class="metric-label">未判定</div>
            <div class="metric-value" id="mvUnjudged">0</div>
            <span class="metric-trend flat">write incomplete</span>
          </div>
        </div>

        <div class="panel-row">
          <div class="panel">
            <div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>合格率</div>
            <div class="ring-wrap">
              ${ringSVG(rate)}
              <div class="ring-legend">
                <div class="row"><span class="dot" style="background:var(--green);"></span>合格 <b>${pass}</b></div>
                <div class="row"><span class="dot" style="background:var(--fail);"></span>否 <b>${fail}</b></div>
                <div class="row"><span class="dot" style="background:var(--line);"></span>未判定 <b>${unjudged}</b></div>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/></svg>客先別 件数</div>
            ${renderBars(stats.byCustomer)}
          </div>
        </div>

        <div class="panel">
          <div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>入力者別 件数</div>
          ${renderList(stats.byInputter)}
        </div>
      `;

      countUp(document.getElementById('mvTotal'), total);
      countUp(document.getElementById('mvPass'), pass);
      countUp(document.getElementById('mvFail'), fail);
      countUp(document.getElementById('mvUnjudged'), unjudged);
      requestAnimationFrame(() => {
        document.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
        const ring = document.getElementById('ringProgress');
        if (ring) setTimeout(() => { ring.style.strokeDashoffset = ring.dataset.offset; }, 100);
      });
    }

    async function load(days){
      try{
        const res = await apiGAS({ action:'getDashboardStats', sinceDays: days });
        if (res && res.ok) {
          render(res);
          document.getElementById('updatedAt').textContent = '更新: ' + new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
        } else throw new Error(res && res.message || '取得に失敗しました');
      }catch(e){
        document.getElementById('content').innerHTML = `<div class="panel"><div class="empty-note">⚠️ 読み込みに失敗しました — ${(e.message||e)}</div></div>`;
      }
    }

    document.querySelectorAll('#rangeTabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#rangeTabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        load(Number(tab.dataset.days));
      });
    });

    load(30);
  </script>
</body>
</html>
