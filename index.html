<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>出荷検査成績書 ポータル</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#1b5fd6" />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="apple-touch-icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1b5fd6; --accent-2:#3b82f6;
    --ink:#161b22; --sub:#68707c; --faint:#a5abb6; --line:#e7e9ee;
    --bg-1:#eef2f8; --bg-2:#e4ebf6; --card:#ffffff;
    --pass:#1b7a4a; --pass-bg:#e9f6ee; --fail:#b3261e; --fail-bg:#fbeceb;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.04);
    --shadow-md:0 8px 24px rgba(20,30,60,.08);
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --accent:#5b8cff; --accent-2:#7ba2ff;
    --ink:#eef1f6; --sub:#8b93a3; --faint:#5c6472; --line:#242a35;
    --bg-1:#0b0e14; --bg-2:#11151e; --card:#12161f;
    --pass:#2fd88a; --pass-bg:#0f2a1e; --fail:#ff6b6b; --fail-bg:#2c1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;
    background:
      radial-gradient(1100px 500px at 12% -10%, #dbe7fb 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #e7f0ff 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh;
  }

  .wrap{ max-width:860px; margin:0 auto; padding:18px 18px calc(96px + env(safe-area-inset-bottom)); }

  /* ---------- App bar ---------- */
  .appbar{ display:flex; align-items:center; gap:10px; padding:4px 2px 12px; }
.appbar-actions{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:2px 2px 18px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
  .appbar-actions::-webkit-scrollbar{ display:none; }
  .appbar .logo{
    width:42px; height:42px; border-radius:12px; background:var(--card); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .appbar .logo img{ width:100%; height:100%; object-fit:contain; padding:6px; }
  .appbar .logo-fallback{ width:100%; height:100%; display:none; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-weight:800; font-size:13px; }
  .appbar-text{ flex:1; min-width:0; }
  .appbar-text .eyebrow{ font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.09em; text-transform:uppercase; }
  .appbar-text h1{ font-size:18px; font-weight:800; margin:1px 0 0; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .dx-badge{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #f0d28a;
  background:linear-gradient(135deg,#fff4d6,#ffe9b3);
  color:#8a5a00;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  text-decoration:none;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.dx-badge:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(20,30,60,.10);
  filter:saturate(1.06);
}

.dx-badge:active{
  transform:scale(.96);
}

.dx-badge:focus-visible{
  outline:3px solid rgba(27,95,214,.22);
  outline-offset:2px;
}
  .dx-badge svg{
  width:15px;
  height:15px;
  stroke-width:2;
}

.action-manual{
  background:linear-gradient(135deg,#eaf1ff,#f3f7ff);
  color:var(--accent);
  border-color:#dde6f9;
}

.action-schedule{
  background:linear-gradient(135deg,#eaf7f0,#f2fbf6);
  color:#0f8a53;
  border-color:#cdeedd;
}

.action-signage{
  background:linear-gradient(135deg,#f3edfd,#f8f4fe);
  color:#7c3aed;
  border-color:#e3d5fb;
}
  /* ---------- Quick stats ---------- */
  .hero-banner{
    position:relative; overflow:hidden; border-radius:22px; padding:22px 24px; margin-bottom:18px;
    background:linear-gradient(120deg,#1b5fd6 0%,#3b82f6 55%,#6a8dfa 100%);
    color:#fff; box-shadow:0 12px 30px -8px rgba(27,95,214,.45);
  }
  .hero-banner::before{
    content:''; position:absolute; right:-30px; top:-40px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%);
  }
  .hero-banner::after{
    content:''; position:absolute; right:60px; bottom:-60px; width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
  }
  .hero-banner-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; position:relative; z-index:1; }
  .hero-banner-eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.85; margin-bottom:6px; }
  .hero-banner-title{ font-size:17px; font-weight:800; line-height:1.5; max-width:340px; }
  .hero-banner-icon{
    flex:0 0 auto; width:56px; height:56px; border-radius:18px; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
  }
  .hero-banner-icon svg{ width:28px; height:28px; }

  .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:20px; }
  .stat-card{
    background:var(--card); border-radius:var(--radius-md); padding:13px 12px; box-shadow:var(--shadow-sm);
    border:1px solid var(--line);
  }
  .stat-card .stat-icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .stat-card .stat-icon svg{ width:14px; height:14px; }
  .stat-card.total .stat-icon{ background:#eaf1ff; color:var(--accent); }
  .stat-card.pass .stat-icon{ background:var(--pass-bg); color:var(--pass); }
  .stat-card.fail .stat-icon{ background:var(--fail-bg); color:var(--fail); }
  .stat-card .stat-num{ font-family:var(--mono); font-size:19px; font-weight:600; line-height:1; }
  .stat-card .stat-label{ font-size:10.5px; color:var(--sub); font-weight:600; margin-top:5px; }

  /* ---------- Search ---------- */
  .search-input-wrap{ position:relative; margin-bottom:12px; }
  .search-input-wrap input{
    width:100%; font-family:inherit; font-size:15.5px; font-weight:500;
    padding:15px 16px 15px 46px; border-radius:16px; border:1px solid var(--line);
    background:var(--card); box-shadow:var(--shadow-sm); outline:none;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .search-input-wrap input::placeholder{ color:#9aa2ad; font-weight:400; }
  .search-input-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px rgba(27,95,214,.12); }
  .search-icon{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; opacity:.4; }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:600; color:var(--sub); cursor:pointer; white-space:nowrap; user-select:none;
    box-shadow:var(--shadow-sm); transition:all .15s ease;
  }
  .chip:hover{ border-color:#c9d4e8; }
  .chip.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(27,95,214,.28); }

  .result-count{ font-size:12px; font-weight:600; color:var(--sub); margin:16px 4px 8px; letter-spacing:.01em; }

  /* ---------- Category tiles (HyperMart風) ---------- */
  .cat-section{ margin-bottom:20px; }
  .cat-section-title{ font-size:12.5px; font-weight:700; color:var(--ink); margin:0 2px 10px; display:flex; align-items:center; justify-content:space-between; }
  .cat-section-title span.sub{ font-size:11px; font-weight:600; color:var(--faint); }
  .cat-grid{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .cat-grid::-webkit-scrollbar{ display:none; }
  .cat-tile{
    flex:0 0 auto; width:84px; display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; padding:2px; border-radius:16px; transition:transform .12s ease;
  }
  .cat-tile:active{ transform:scale(.94); }
  .cat-tile-icon{
    width:68px; height:68px; border-radius:19px; display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:800; color:#fff; box-shadow:0 6px 16px -4px var(--tile-shadow, rgba(27,95,214,.35));
    position:relative; border:2.5px solid transparent;
  }
  .cat-tile-icon svg{ width:26px; height:26px; }
  .cat-tile.active .cat-tile-icon{ border-color:var(--ink); }
  .cat-tile-count{
    position:absolute; top:-4px; right:-4px; background:#fff; color:#1a1d23; font-size:9.5px; font-weight:800;
    min-width:18px; height:18px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .cat-tile-label{ font-size:10.5px; font-weight:700; color:var(--ink); text-align:center; line-height:1.25; }

  /* ---------- List / product-cards ---------- */
  .list{ display:flex; flex-direction:column; gap:12px; }
  .card{
    display:flex; align-items:stretch; gap:0; background:var(--card); border-radius:20px;
    overflow:hidden; box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; border:1px solid var(--line);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:active{ transform:scale(.98); }
  @media (hover:hover){ .card:hover{ box-shadow:var(--shadow-md); border-color:#d3ddf0; transform:translateY(-1px); } }
  .card-hero{
    flex:0 0 auto; width:84px; display:flex; align-items:center; justify-content:center; position:relative;
    font-size:30px; font-weight:800; color:#fff;
  }
  .card-hero svg{ width:32px; height:32px; position:relative; z-index:1; }
  .card-hero::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 20% 15%, rgba(255,255,255,.28), transparent 60%);
  }
  .card-badge{
    position:absolute; top:8px; left:8px; background:rgba(255,255,255,.92); color:#1a1d23;
    font-size:9px; font-weight:800; padding:3px 7px; border-radius:999px; letter-spacing:.02em;
  }
  .card-body{ flex:1 1 auto; min-width:0; padding:14px 15px; display:flex; align-items:center; gap:10px; }
  .card-main{ flex:1 1 auto; min-width:0; }
  .card-customer{ font-size:11.5px; font-weight:600; color:var(--accent); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.01em; }
  .card-title{ font-size:15.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-sub{ font-size:12px; color:var(--sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
  .card-sub .dot{ width:4px; height:4px; border-radius:50%; background:var(--faint); flex:0 0 auto; }
  .card-arrow{ flex:0 0 auto; color:#c3ccdb; transition:transform .12s ease, color .12s ease; }
  .card-arrow svg{ width:18px; height:18px; }
  .card:hover .card-arrow{ transform:translateX(2px); color:var(--accent); }

  .empty{ text-align:center; color:var(--sub); padding:60px 10px; font-size:14px; }
  .empty .big{ font-size:34px; margin-bottom:10px; opacity:.7; }

  .footer-note{ text-align:center; margin-top:30px; font-size:11px; color:var(--faint); font-weight:500; letter-spacing:.02em; }

  /* ---------- Bottom nav (app-style) ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(20,30,60,.07);
  }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.92); }
  .theme-toggle{ width:36px; height:36px; border-radius:11px; background:var(--card); box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; color:var(--ink-soft, var(--ink)); cursor:pointer; flex:0 0 auto; }
  .theme-toggle svg{ width:17px; height:17px; }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700;
    padding:4px 20px; border-radius:12px; transition:color .15s ease;
  }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }
</style>
</head>

  #kensaAuthCard h2{font-size:15px;margin:0 0 4px;color:#161b22;font-weight:800;}

  #kensaUserBadge .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#1b5fd6,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;}

  #kensaUserBadge button:active{transform:scale(.95);}
  #kensaUserBadge button:hover{background:#ffe9e9;}
  #kensaOfflineBadge{display:none;position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9998;background:#161b22;color:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);font-family:"Inter",sans-serif;align-items:center;gap:6px;white-space:nowrap;}
  @media print{ #kensaAuthOverlay, #kensaUserBadge, #kensaOfflineBadge{ display:none !important; } }
</style>

<script>
(function(){
  var AUTH_KEY = 'kensa:session';
  var QUEUE_KEY = 'kensa:offlineQueue';
  var QUEUEABLE_ACTIONS = ['logSave','addScheduleItem','markScheduleDone','deleteScheduleItem','saveShipment'];

  function getSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
  function setSession(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(AUTH_KEY); }
  window.__kensaAuth = { getSession: getSession, setSession: setSession, clearSession: clearSession };

  function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
  function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

  function findGasUrl(){
    if (window.GAS_URL) return window.GAS_URL;
    var m = document.documentElement.innerHTML.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
    return m ? m[0] : null;
  }

  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
      try{
        var body = JSON.parse(opts.body);
        if (body.action !== 'login'){
          var s = getSession();
          body.token = s ? s.token : '';
        }
        opts = Object.assign({}, opts, { body: JSON.stringify(body) });
      }catch(e){}
    }
    return _fetch(url, opts).then(function(res){
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1){
        res.clone().json().then(function(j){
          if (j && j.ok === false && (j.error === 'unauthorized' || j.error === 'session-expired')){
            clearSession(); showGate();
          }
        }).catch(function(){});
      }
      return res;
    }).catch(function(err){
      // Network gagal (offline) — untuk aksi ringan tertentu, antrekan supaya tidak hilang.
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
        try{
          var b = JSON.parse(opts.body);
          if (QUEUEABLE_ACTIONS.indexOf(b.action) !== -1 && opts.body.length < 200000){
            var q = getQueue();
            q.push({ url: url, body: opts.body, ts: Date.now() });
            setQueue(q);
            updateOfflineBadge();
            return new Response(JSON.stringify({ ok:true, queued:true }), { status:200, headers:{'Content-Type':'application/json'} });
          }
        }catch(e){}
      }
      throw err;
    });
  };

  function updateOfflineBadge(){
    var el = document.getElementById('kensaOfflineBadge');
    if (!el) return;
    var q = getQueue();
    if (q.length > 0){
      el.style.display = 'flex';
      el.textContent = (navigator.onLine ? '\u9001\u4fe1\u4e2d\u2026 ' : '\ud83d\udd0c \u30aa\u30d5\u30e9\u30a4\u30f3\u4fdd\u5b58\u4e2d ') + q.length + '\u4ef6';
    } else {
      el.style.display = 'none';
    }
  }

  function flushQueue(){
    var q = getQueue();
    if (q.length === 0) return;
    (function next(){
      var cur = getQueue();
      if (cur.length === 0){ updateOfflineBadge(); return; }
      var item = cur[0];
      _fetch(item.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: item.body })
        .then(function(res){ return res.json().catch(function(){ return {ok:true}; }); })
        .then(function(j){
          var q2 = getQueue();
          q2.shift(); setQueue(q2); updateOfflineBadge();
          if (getQueue().length > 0) next();
        })
        .catch(function(){ updateOfflineBadge(); /* masih offline, coba lagi nanti */ });
    })();
  }
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, 20000);

  function showGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'flex';
    var badge = document.getElementById('kensaUserBadge'); if (badge) badge.style.display = 'none';
    setTimeout(function(){ var i = document.getElementById('kensaAuthPin'); if(i) i.focus(); }, 50);
  }
  function hideGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'none';
  }
  function showUserBadge(s){
    var badge = document.getElementById('kensaUserBadge');
    if (!badge || !s) return;
    document.getElementById('kensaUserName').textContent = s.userName || '\u4e0d\u660e';
    document.getElementById('kensaUserRole').textContent = s.role === 'admin' ? '\u7ba1\u7406\u8005' : '\u30aa\u30da\u30ec\u30fc\u30bf\u30fc';
    document.getElementById('kensaUserAvatar').textContent = (s.userName || '?').slice(0,1);
    badge.style.display = 'flex';
    document.querySelectorAll('.admin-only').forEach(function(el){ el.style.display = (s.role === 'admin') ? '' : 'none'; });
    document.body.setAttribute('data-role', s.role || 'operator');
  }

  function doLogin(){
    var pinInput = document.getElementById('kensaAuthPin');
    var errEl = document.getElementById('kensaAuthErr');
    var btn = document.getElementById('kensaAuthBtn');
    var pin = (pinInput.value || '').trim();
    if (!pin){ errEl.textContent = 'PIN\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'; return; }
    var gasUrl = findGasUrl();
    if (!gasUrl){ errEl.textContent = '\u30d0\u30c3\u30af\u30a8\u30f3\u30c9URL\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093'; return; }
    btn.disabled = true; btn.textContent = '\u78ba\u8a8d\u4e2d\u2026'; errEl.textContent = '';
    _fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'login', pin: pin, deviceName: navigator.userAgent.slice(0,60) }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          var s = { token: data.token, expiresAt: Date.now() + (data.expiresInHours||12) * 3600 * 1000, userName: data.userName, role: data.role };
          setSession(s);
          hideGate();
          location.reload();
        } else {
          errEl.textContent = (data && data.message) || 'PIN\u304c\u9055\u3044\u307e\u3059';
          btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
        }
      })
      .catch(function(){
        errEl.textContent = '\u901a\u4fe1\u30a8\u30e9\u30fc\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
        btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('kensaAuthBtn');
    var pinInput = document.getElementById('kensaAuthPin');
    if (btn) btn.addEventListener('click', doLogin);
    if (pinInput) pinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });
    var logoutBtn = document.getElementById('kensaLogoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', function(){
      if (confirm('\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3059\u304b\uff1f')){ clearSession(); location.reload(); }
    });

    var s = getSession();
    if (!s || !s.token || !s.expiresAt || s.expiresAt < Date.now()){
      clearSession();
      showGate();
    } else {
      showUserBadge(s);
      updateOfflineBadge();
      flushQueue();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    /* =====================================================================
       ここに新しいフォームを1行ずつ追加してください（コピペでOK）:
       { customer:'客先名', kikishu:'機種', hinmei:'品名', zuban:'図番', file:'ファイル名.html' }
       ===================================================================== */
    const FORM_REGISTRY = [
      { customer:'中村留精密工業㈱', kikishu:'WY-150V', hinmei:'X3プロテクター', zuban:'3596-70', file:'WY-150V.html' },
      { customer:'中村留精密工業㈱', kikishu:'NTY3-100V', hinmei:'X2プロテクター', zuban:'3555-7', file:'NTY3-100V.html' },
      { customer:'オークマ株式会社',   kikishu:'MB-46V',  hinmei:'Y軸SG',          zuban:'2825-20', file:'MB-46V.html' },
      { customer:'オークマ株式会社',   kikishu:'MB-56V',  hinmei:'Y軸SG',          zuban:'2835-20', file:'MB-56V.html' },
      { customer:'オークマ株式会社',   kikishu:'MB-66V',  hinmei:'Y軸SG',          zuban:'2823-20', file:'MB-66V.html' },
      { customer:'オークマ株式会社',   kikishu:'MB-80V(右)',  hinmei:'X軸(右側)SG',   zuban:'3305-20', file:'MB-80V-XR.html' },
      // 例（コピーして書き換えてください）:
      // { customer:'〇〇工業㈱', kikishu:'AB-100', hinmei:'カバー', zuban:'1234-56', file:'AB-100.html' },
    ];
    /* ===================================================================== */

    // 客先ごとに固定の色（アバター用）
    const AVATAR_COLORS = ['#1b5fd6','#0f9d6d','#c2410c','#7c3aed','#be123c','#0891b2'];
    function colorFor(name){
      let h = 0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    const searchInput = document.getElementById('searchInput');
    const catGridEl = document.getElementById('catGrid');
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('resultCount');

    let activeCustomer = null;

    function initials(str){ const s=(str||'').trim(); return s ? s[0] : '?'; }

    const QC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>';

    function buildCatTiles(){
      const customers = [...new Set(FORM_REGISTRY.map(f => f.customer))].sort((a,b)=>a.localeCompare(b,'ja'));
      catGridEl.innerHTML = '';

      const allTile = document.createElement('div');
      allTile.className = 'cat-tile active';
      allTile.innerHTML = `
        <div class="cat-tile-icon" style="background:linear-gradient(135deg,var(--accent),var(--accent-2));">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="cat-tile-count">${FORM_REGISTRY.length}</span>
        </div>
        <div class="cat-tile-label">すべて</div>
      `;
      allTile.onclick = () => { activeCustomer = null; render(); };
      catGridEl.appendChild(allTile);

      customers.forEach(c => {
        const n = FORM_REGISTRY.filter(f => f.customer === c).length;
        const color = colorFor(c);
        const tile = document.createElement('div');
        tile.className = 'cat-tile';
        tile.dataset.customer = c;
        tile.innerHTML = `
          <div class="cat-tile-icon" style="background:${color}; --tile-shadow:${color}59;">
            ${QC_ICON}
            <span class="cat-tile-count">${n}</span>
          </div>
          <div class="cat-tile-label">${c.length > 8 ? c.slice(0,7)+'…' : c}</div>
        `;
        tile.onclick = () => { activeCustomer = c; render(); };
        catGridEl.appendChild(tile);
      });
    }

    function updateCatTiles(){
      Array.from(catGridEl.children).forEach(tile => {
        const isAll = !tile.dataset.customer;
        tile.classList.toggle('active', isAll ? activeCustomer === null : tile.dataset.customer === activeCustomer);
      });
    }

    function matches(entry, q){
      if(!q) return true;
      const hay = `${entry.customer} ${entry.kikishu} ${entry.hinmei} ${entry.zuban}`.toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    function render(){
      updateCatTiles();
      const q = searchInput.value.trim();
      const filtered = FORM_REGISTRY.filter(f => (activeCustomer === null || f.customer === activeCustomer) && matches(f, q));

      countEl.textContent = `${filtered.length} 件`;
      listEl.innerHTML = '';

      if(filtered.length === 0){ emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';

      filtered
        .sort((a,b)=> a.customer.localeCompare(b.customer,'ja') || a.kikishu.localeCompare(b.kikishu,'ja'))
        .forEach(f => {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = f.file;
          const c = colorFor(f.customer);
          a.innerHTML = `
            <div class="card-hero" style="background:${c};">
              <span class="card-badge">検査対応</span>
              ${QC_ICON}
            </div>
            <div class="card-body">
              <div class="card-main">
                <div class="card-customer">${f.customer}</div>
                <div class="card-title">${f.kikishu}　${f.hinmei}</div>
                <div class="card-sub">図番: ${f.zuban || '—'}</div>
              </div>
              <div class="card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
            </div>
          `;
          listEl.appendChild(a);
        });
    }

    searchInput.addEventListener('input', render);
    buildCatTiles();
    render();

    /* ---------- Quick stats (今週) ---------- */
    async function loadQuickStats(){
      try{
        const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'getDashboardStats', sinceDays:7 }) });
        const data = await res.json();
        if (data && data.ok){
          document.getElementById('statTotal').textContent = data.total ?? 0;
          document.getElementById('statPass').textContent = data.pass ?? 0;
          document.getElementById('statFail').textContent = data.fail ?? 0;
        }
      }catch(e){ /* diamkan — statistik cuma pemanis, jangan blokir portal kalau gagal */ }
    }
    loadQuickStats();
  </script>
</body>
