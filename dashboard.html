<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ダッシュボード — 出荷検査成績書</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#14181f" />
<link rel="icon" href="tsh.png" onerror="this.remove()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --ink-soft:#3d4451; --sub:#7a8291; --faint:#a5abb6;
    --line:#e7e9ee; --line-soft:#f0f1f4; --bg:#f7f8fa; --card:#ffffff;
    --accent:#2451c4; --accent-soft:#eef2fc;
    --pass:#1b7a4a; --pass-soft:#e9f6ee;
    --fail:#b3261e; --fail-soft:#fbeceb;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:880px; margin:0 auto; padding:32px 22px 80px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .topbar a{ color:var(--sub); text-decoration:none; font-size:13px; font-weight:500; display:flex; align-items:center; gap:5px; }
  .back-btn svg{ width:16px; height:16px; }
  .wrap{ padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(20,30,60,.07);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:#a5abb6; font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; font-family:"Inter","Noto Sans JP",sans-serif; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }
  .topbar a:hover{ color:var(--ink); }
  .topbar .updated{ font-size:11.5px; color:var(--faint); font-family:var(--mono); }

  .header{ margin-bottom:26px; }
  .header .eyebrow{ font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .header h1{ font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em; }
  .header p{ margin:5px 0 0; color:var(--sub); font-size:13px; }

  .range-tabs{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:24px; }
  .range-tabs .tab{ padding:6px 16px; font-size:12.5px; font-weight:600; color:var(--sub); border-radius:6px; cursor:pointer; }
  .range-tabs .tab.active{ background:var(--ink); color:#fff; }

  .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:24px; }
  .metric{ background:var(--card); padding:18px 16px; }
  .metric-label{ font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .metric-value{ font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em; }
  .metric-value.pass{ color:var(--pass); }
  .metric-value.fail{ color:var(--fail); }
  .metric-sub{ font-size:11px; color:var(--faint); margin-top:4px; font-family:var(--mono); }

  .panel-row{ display:grid; grid-template-columns:1fr 1.4fr; gap:16px; margin-bottom:16px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .panel-title{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:16px; }

  .ring-wrap{ display:flex; align-items:center; gap:18px; }
  .ring-legend{ font-size:12px; color:var(--sub); }
  .ring-legend .row{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  .ring-legend .dot{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }

  .bars{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:110px 1fr 42px; align-items:center; gap:10px; }
  .bar-row .name{ font-size:12.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .bar-row .count{ font-family:var(--mono); font-size:11.5px; color:var(--faint); text-align:right; }

  .table-list{ display:flex; flex-direction:column; }
  .table-list .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .table-list .row:last-child{ border-bottom:none; }
  .table-list .name{ color:var(--ink-soft); font-weight:500; }
  .table-list .count{ font-family:var(--mono); color:var(--faint); }

  .empty-note{ color:var(--faint); font-size:12.5px; padding:10px 0; }
  .loading{ text-align:center; color:var(--faint); padding:70px 10px; font-size:13px; font-family:var(--mono); }
  .footer{ text-align:center; margin-top:44px; font-size:11px; color:var(--faint); font-weight:500; letter-spacing:.02em; }

  @media (max-width:640px){
    .metrics{ grid-template-columns:repeat(2,1fr); }
    .panel-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> ポータル</a>
      <span class="updated" id="updatedAt"></span>
    </div>

    <div class="header">
      <div class="eyebrow">Quality Overview</div>
      <h1>出荷検査ダッシュボード</h1>
      <p>Logsシートから自動集計された検査結果サマリー</p>
    </div>

    <div class="range-tabs" id="rangeTabs">
      <div class="tab" data-days="7">7日</div>
      <div class="tab active" data-days="30">30日</div>
      <div class="tab" data-days="90">90日</div>
    </div>

    <div id="content"><div class="loading">LOADING…</div></div>
    <div class="footer">© 東京精密発條株式会社 All Rights Reserved　／　Design by Wahyu</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      ポータル
    </a>
    <a href="riwayat.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      履歴
    </a>
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
      ダッシュボード
    </a>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    async function apiGAS(body){
      if (GAS_URL.includes('GANTI_DENGAN')) throw new Error('GAS_URL belum diatur di dashboard.html');
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function ringSVG(rate){
      const r = 42, c = 2*Math.PI*r;
      const offset = c * (1 - rate/100);
      const color = rate >= 90 ? 'var(--pass)' : (rate >= 70 ? '#b8860b' : 'var(--fail)');
      return `
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="10"/>
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="10"
            stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
            transform="rotate(-90 52 52)"/>
          <text x="52" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600" fill="var(--ink)">${rate}%</text>
          <text x="52" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="var(--sub)">合格率</text>
        </svg>`;
    }

    function renderBars(rows){
      if (!rows || rows.length === 0) return `<div class="empty-note">データがありません</div>`;
      const max = Math.max(...rows.slice(0,8).map(r=>r.count));
      return `<div class="bars">` + rows.slice(0,8).map(r => `
        <div class="bar-row">
          <span class="name" title="${r.name}">${r.name}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round((r.count/max)*100)}%;"></div></div>
          <span class="count">${r.count}</span>
        </div>`).join('') + `</div>`;
    }

    function renderList(rows){
      if (!rows || rows.length === 0) return `<div class="empty-note">データがありません</div>`;
      return `<div class="table-list">` + rows.slice(0,8).map(r => `
        <div class="row"><span class="name">${r.name}</span><span class="count">${r.count} 件</span></div>
      `).join('') + `</div>`;
    }

    function render(stats){
      const total = stats.total || 0;
      const pass = stats.pass || 0;
      const fail = stats.fail || 0;
      const unjudged = Math.max(0, total - pass - fail);
      const judged = pass + fail;
      const rate = judged > 0 ? Math.round((pass / judged) * 100) : 0;

      document.getElementById('content').innerHTML = `
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">総検査数</div>
            <div class="metric-value">${total}</div>
            <div class="metric-sub">直近${stats.sinceDays}日間</div>
          </div>
          <div class="metric">
            <div class="metric-label">合格</div>
            <div class="metric-value pass">${pass}</div>
            <div class="metric-sub">${judged > 0 ? Math.round(pass/judged*100) : 0}% of judged</div>
          </div>
          <div class="metric">
            <div class="metric-label">否</div>
            <div class="metric-value fail">${fail}</div>
            <div class="metric-sub">${judged > 0 ? Math.round(fail/judged*100) : 0}% of judged</div>
          </div>
          <div class="metric">
            <div class="metric-label">未判定</div>
            <div class="metric-value">${unjudged}</div>
            <div class="metric-sub">write incomplete</div>
          </div>
        </div>

        <div class="panel-row">
          <div class="panel">
            <div class="panel-title">合格率</div>
            <div class="ring-wrap">
              ${ringSVG(rate)}
              <div class="ring-legend">
                <div class="row"><span class="dot" style="background:var(--pass);"></span>合格 ${pass}件</div>
                <div class="row"><span class="dot" style="background:var(--fail);"></span>否 ${fail}件</div>
                <div class="row"><span class="dot" style="background:var(--line);"></span>未判定 ${unjudged}件</div>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">客先別 件数</div>
            ${renderBars(stats.byCustomer)}
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">入力者別 件数</div>
          ${renderList(stats.byInputter)}
        </div>
      `;
    }

    async function load(days){
      document.getElementById('content').innerHTML = '<div class="loading">LOADING…</div>';
      try{
        const res = await apiGAS({ action:'getDashboardStats', sinceDays: days });
        if (res && res.ok) {
          render(res);
          document.getElementById('updatedAt').textContent = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
        } else throw new Error(res && res.message || '取得に失敗しました');
      }catch(e){
        document.getElementById('content').innerHTML = `<div class="loading">読み込みに失敗しました — ${(e.message||e)}</div>`;
      }
    }

    document.querySelectorAll('#rangeTabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#rangeTabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        load(Number(tab.dataset.days));
      });
    });

    load(30);
  </script>
</body>
</html>
