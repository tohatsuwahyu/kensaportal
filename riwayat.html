<style>
  :root{
    --accent:#1b5fd6; --accent-2:#3b82f6; --ink:#161b22; --sub:#68707c; --faint:#a5abb6; --line:#e7e9ee;
    --bg-1:#eef2f8; --bg-2:#e4ebf6; --card:#ffffff;
    --pass:#1d8a4a; --pass-bg:#e7f7ee; --fail:#c62828; --fail-bg:#fdecea;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.04);
    --shadow-md:0 8px 24px rgba(20,30,60,.08);
  }
  html[data-theme="dark"]{
    --accent:#5b8cff; --accent-2:#7ba2ff; --ink:#eef1f6; --sub:#8b93a3; --faint:#5c6472; --line:#242a35;
    --bg-1:#0b0e14; --bg-2:#11151e; --card:#12161f;
    --pass:#2fd88a; --pass-bg:#0f2a1e; --fail:#ff6b6b; --fail-bg:#2c1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink); transition:background .25s ease, color .25s ease;
    background: radial-gradient(1100px 500px at 12% -10%, #dbe7fb 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #e7f0ff 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:18px 18px calc(96px + env(safe-area-inset-bottom)); }

  .appbar{ display:flex; align-items:center; gap:10px; padding:4px 2px 18px; }
  .appbar .back{
    width:36px; height:36px; border-radius:11px; background:var(--card); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; color:var(--ink); text-decoration:none; flex:0 0 auto;
  }
  .appbar .back svg{ width:18px; height:18px; }
  .appbar-text .eyebrow{ font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.09em; text-transform:uppercase; }
  .appbar-text h1{ font-size:18px; font-weight:800; margin:1px 0 0; }

  .search-input-wrap{ position:relative; margin-bottom:14px; }
  .search-input-wrap input{
    width:100%; font-family:inherit; font-size:15.5px; font-weight:500;
    padding:15px 16px 15px 46px; border-radius:16px; border:1px solid var(--line);
    background:var(--card); box-shadow:var(--shadow-sm); outline:none;
  }
  .search-input-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px rgba(27,95,214,.12); }
  .search-icon{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; opacity:.4; }

  .result-count{ font-size:12px; font-weight:600; color:var(--sub); margin:6px 4px 10px; }

  /* ---------- Filter cepat (客先 / 機種) ---------- */
  .chip-row{ display:flex; gap:7px; overflow-x:auto; padding:2px 2px 8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip-row-label{ font-size:10.5px; font-weight:700; color:var(--faint); margin:0 4px 5px; text-transform:uppercase; letter-spacing:.04em; }
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    font-size:12px; font-weight:600; color:var(--sub); cursor:pointer; white-space:nowrap; user-select:none;
    box-shadow:var(--shadow-sm); transition:all .15s ease;
  }
  .chip .n{ opacity:.6; font-size:10.5px; margin-left:2px; }
  .chip.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff; box-shadow:0 4px 12px rgba(27,95,214,.25); }

  /* ---------- Tombol reprint ---------- */
  .card-footer{ display:flex; justify-content:flex-end; margin-top:9px; }
  .reprint-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:10px;
    background:var(--accent-soft, #eaf1ff); color:var(--accent); font-size:11.5px; font-weight:700;
    text-decoration:none; border:1px solid transparent;
  }
  .reprint-btn svg{ width:13px; height:13px; }
  .reprint-btn:active{ transform:scale(.96); }

  .list{ display:flex; flex-direction:column; gap:9px; }
  .card{
    display:block; background:var(--card); border-radius:14px; padding:13px 15px;
    box-shadow:var(--shadow-sm); border:1px solid var(--line); text-decoration:none; color:inherit;
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .card:active{ transform:scale(.98); }
  @media (hover:hover){ .card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); } }
  .card-row1{ display:flex; align-items:center; gap:12px; }
  .card-icon{ flex:0 0 auto; width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
  .card-main{ flex:1; min-width:0; }
  .card-customer{ font-size:11px; font-weight:600; color:var(--accent); margin-bottom:2px; }
  .card-title{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-sub{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .badge{ flex:0 0 auto; font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap; }
  .badge.pass{ color:var(--pass); background:var(--pass-bg); }
  .badge.fail{ color:var(--fail); background:var(--fail-bg); }
  .badge.unknown{ color:var(--sub); background:#f1f3f6; }
  .no-link{ font-size:10.5px; color:#b6bcc6; margin-top:6px; padding-left:50px; }

  .empty{ text-align:center; color:var(--sub); padding:60px 10px; font-size:14px; }
  .empty .big{ font-size:34px; margin-bottom:10px; opacity:.7; }
  .loading{ text-align:center; color:var(--sub); padding:40px 10px; font-size:13.5px; }
  .footer-note{ text-align:center; margin-top:30px; font-size:11px; color:var(--faint); font-weight:500; letter-spacing:.02em; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(20,30,60,.07);
  }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.92); }
  .theme-toggle{ width:36px; height:36px; border-radius:11px; background:var(--card); box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; flex:0 0 auto; margin-left:auto; }
  .theme-toggle svg{ width:17px; height:17px; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }
</style>

  #kensaUserBadge{display:none;position:fixed;top:8px;right:8px;z-index:9998;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid #e7e9ee;border-radius:999px;padding:5px 8px 5px 5px;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#161b22;box-shadow:0 4px 14px rgba(0,0,0,.1);font-family:"Inter",sans-serif;}
  #kensaUserBadge .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#1b5fd6,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;}

  #kensaUserBadge button{border:1px solid #f0d0d0;background:#fff5f5;cursor:pointer;color:#c0392b;font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:999px;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  #kensaUserBadge button:active{transform:scale(.95);}
  #kensaUserBadge button:hover{background:#ffe9e9;}
  #kensaOfflineBadge{display:none;position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9998;background:#161b22;color:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);font-family:"Inter",sans-serif;align-items:center;gap:6px;white-space:nowrap;}
  @media print{ #kensaAuthOverlay, #kensaUserBadge, #kensaOfflineBadge{ display:none !important; } }
</style>

<div id="kensaOfflineBadge"></div>
<script>
(function(){
  var AUTH_KEY = 'kensa:session';
  var QUEUE_KEY = 'kensa:offlineQueue';
  var QUEUEABLE_ACTIONS = ['logSave','addScheduleItem','markScheduleDone','deleteScheduleItem','saveShipment'];

  function getSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
  function setSession(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(AUTH_KEY); }
  window.__kensaAuth = { getSession: getSession, setSession: setSession, clearSession: clearSession };

  function getQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
  function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

  function findGasUrl(){
    if (window.GAS_URL) return window.GAS_URL;
    var m = document.documentElement.innerHTML.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
    return m ? m[0] : null;
  }

  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
      try{
        var body = JSON.parse(opts.body);
        if (body.action !== 'login'){
          var s = getSession();
          body.token = s ? s.token : '';
        }
        opts = Object.assign({}, opts, { body: JSON.stringify(body) });
      }catch(e){}
    }
    return _fetch(url, opts).then(function(res){
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1){
        res.clone().json().then(function(j){
          if (j && j.ok === false && (j.error === 'unauthorized' || j.error === 'session-expired')){
            clearSession(); showGate();
          }
        }).catch(function(){});
      }
      return res;
    }).catch(function(err){
      // Network gagal (offline) — untuk aksi ringan tertentu, antrekan supaya tidak hilang.
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
        try{
          var b = JSON.parse(opts.body);
          if (QUEUEABLE_ACTIONS.indexOf(b.action) !== -1 && opts.body.length < 200000){
            var q = getQueue();
            q.push({ url: url, body: opts.body, ts: Date.now() });
            setQueue(q);
            updateOfflineBadge();
            return new Response(JSON.stringify({ ok:true, queued:true }), { status:200, headers:{'Content-Type':'application/json'} });
          }
        }catch(e){}
      }
      throw err;
    });
  };

  function updateOfflineBadge(){
    var el = document.getElementById('kensaOfflineBadge');
    if (!el) return;
    var q = getQueue();
    if (q.length > 0){
      el.style.display = 'flex';
      el.textContent = (navigator.onLine ? '\u9001\u4fe1\u4e2d\u2026 ' : '\ud83d\udd0c \u30aa\u30d5\u30e9\u30a4\u30f3\u4fdd\u5b58\u4e2d ') + q.length + '\u4ef6';
    } else {
      el.style.display = 'none';
    }
  }

  function flushQueue(){
    var q = getQueue();
    if (q.length === 0) return;
    (function next(){
      var cur = getQueue();
      if (cur.length === 0){ updateOfflineBadge(); return; }
      var item = cur[0];
      _fetch(item.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: item.body })
        .then(function(res){ return res.json().catch(function(){ return {ok:true}; }); })
        .then(function(j){
          var q2 = getQueue();
          q2.shift(); setQueue(q2); updateOfflineBadge();
          if (getQueue().length > 0) next();
        })
        .catch(function(){ updateOfflineBadge(); /* masih offline, coba lagi nanti */ });
    })();
  }
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, 20000);

  function showGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'flex';
    var badge = document.getElementById('kensaUserBadge'); if (badge) badge.style.display = 'none';
    setTimeout(function(){ var i = document.getElementById('kensaAuthPin'); if(i) i.focus(); }, 50);
  }
  function hideGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'none';
  }
  function showUserBadge(s){
    var badge = document.getElementById('kensaUserBadge');
    if (!badge || !s) return;
    document.getElementById('kensaUserName').textContent = s.userName || '\u4e0d\u660e';
    document.getElementById('kensaUserRole').textContent = s.role === 'admin' ? '\u7ba1\u7406\u8005' : '\u30aa\u30da\u30ec\u30fc\u30bf\u30fc';
    document.getElementById('kensaUserAvatar').textContent = (s.userName || '?').slice(0,1);
    badge.style.display = 'flex';
    document.querySelectorAll('.admin-only').forEach(function(el){ el.style.display = (s.role === 'admin') ? '' : 'none'; });
    document.body.setAttribute('data-role', s.role || 'operator');
  }

  function doLogin(){
    var pinInput = document.getElementById('kensaAuthPin');
    var errEl = document.getElementById('kensaAuthErr');
    var btn = document.getElementById('kensaAuthBtn');
    var pin = (pinInput.value || '').trim();
    if (!pin){ errEl.textContent = 'PIN\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'; return; }
    var gasUrl = findGasUrl();
    if (!gasUrl){ errEl.textContent = '\u30d0\u30c3\u30af\u30a8\u30f3\u30c9URL\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093'; return; }
    btn.disabled = true; btn.textContent = '\u78ba\u8a8d\u4e2d\u2026'; errEl.textContent = '';
    _fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'login', pin: pin, deviceName: navigator.userAgent.slice(0,60) }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          var s = { token: data.token, expiresAt: Date.now() + (data.expiresInHours||12) * 3600 * 1000, userName: data.userName, role: data.role };
          setSession(s);
          hideGate();
          location.reload();
        } else {
          errEl.textContent = (data && data.message) || 'PIN\u304c\u9055\u3044\u307e\u3059';
          btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
        }
      })
      .catch(function(){
        errEl.textContent = '\u901a\u4fe1\u30a8\u30e9\u30fc\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
        btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('kensaAuthBtn');
    var pinInput = document.getElementById('kensaAuthPin');
    if (btn) btn.addEventListener('click', doLogin);
    if (pinInput) pinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });
    var logoutBtn = document.getElementById('kensaLogoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', function(){
      if (confirm('\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3059\u304b\uff1f')){ clearSession(); location.reload(); }
    });

    var s = getSession();
    if (!s || !s.token || !s.expiresAt || s.expiresAt < Date.now()){
      clearSession();
      showGate();
    } else {
      showUserBadge(s);
      updateOfflineBadge();
      flushQueue();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

      ポータル
    </a>
    <a href="riwayat.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
      履歴
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
      ダッシュボード
    </a>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('emptyState');
    const loadingEl = document.getElementById('loadingState');
    const countEl = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');

    const AVATAR_COLORS = ['#1b5fd6','#0f9d6d','#c2410c','#7c3aed','#be123c','#0891b2'];
    function colorFor(name){
      let h = 0; for (let i=0;i<(name||'').length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function initials(str){ const s=(str||'').trim(); return s ? s[0] : '?'; }

    let __allRows = [];
    let __debounceTimer = null;
    let __activeCustomer = null;
    let __activeKikishu = null;

    async function apiGAS(body){
      if (GAS_URL.includes('GANTI_DENGAN')) throw new Error('GAS_URL belum diatur di riwayat.html');
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    function fmtDate(iso){
      try{ const d = new Date(iso); return d.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
      catch(e){ return iso || ''; }
    }

    function judgeBadge(j){
      if (j === '合格') return `<span class="badge pass">合格</span>`;
      if (j === '否') return `<span class="badge fail">否</span>`;
      return `<span class="badge unknown">未判定</span>`;
    }

    /* ---------- チップ（客先／機種）を今読み込んでいるデータから動的生成 ---------- */
    function buildChipCounts(rows, field){
      const counts = {};
      rows.forEach(r => { const v = (r[field]||'').trim(); if (v) counts[v] = (counts[v]||0)+1; });
      return Object.keys(counts).sort((a,b) => counts[b]-counts[a]).map(name => ({ name, count: counts[name] }));
    }
    function renderChipRow(containerEl, items, activeValue, onClick, allLabel){
      if (items.length === 0){ containerEl.innerHTML = ''; return; }
      const allChip = `<div class="chip ${activeValue===null?'active':''}" data-all="1">${allLabel}</div>`;
      const chips = items.slice(0, 12).map(it => `
        <div class="chip ${activeValue===it.name?'active':''}" data-name="${it.name}">${it.name}<span class="n">${it.count}</span></div>
      `).join('');
      containerEl.innerHTML = allChip + chips;
      containerEl.querySelectorAll('.chip').forEach(el => {
        el.addEventListener('click', () => onClick(el.dataset.all ? null : el.dataset.name));
      });
    }
    function buildChips(){
      renderChipRow(
        document.getElementById('customerChips'),
        buildChipCounts(__allRows, 'customer'),
        __activeCustomer,
        (v) => { __activeCustomer = v; buildChips(); applyFilter(); },
        'すべての客先'
      );
      renderChipRow(
        document.getElementById('kikishuChips'),
        buildChipCounts(__allRows, 'kikishu'),
        __activeKikishu,
        (v) => { __activeKikishu = v; buildChips(); applyFilter(); },
        'すべての機種'
      );
    }

    function render(rows){
      listEl.innerHTML = '';
      countEl.textContent = `${rows.length} 件`;
      if (rows.length === 0){ emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';
      rows.forEach(row => {
        const el = document.createElement('div');
        el.className = 'card';
        const c = colorFor(row.customer);
        el.innerHTML = `
          <div class="card-row1">
            <div class="card-icon" style="background:${c};">${initials(row.hinmei || row.customer)}</div>
            <div class="card-main">
              <div class="card-customer">${row.customer || '—'}${row.kikishu ? ' ・ ' + row.kikishu : ''}</div>
              <div class="card-title">${row.hinmei || '—'} ／ ${row.serial_full || '—'}</div>
              ${row.hinban ? `<div class="card-sub">品番: ${row.hinban}</div>` : ''}
              <div class="card-sub">図番: ${row.zuban || '—'} ・ 製造日: ${row.making_date || '—'}</div>
              <div class="card-sub">${fmtDate(row.timestamp)} ・ 入力: ${row.inputter || '—'}</div>
            </div>
            ${judgeBadge(row.judgment)}
          </div>
          <div class="card-footer">
            ${row.file_url
              ? `<a class="reprint-btn" href="${row.file_url}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>再印刷</a>`
              : `<span class="no-link">PDFリンクなし</span>`}
          </div>
        `;
        listEl.appendChild(el);
      });
    }

    function applyFilter(){
      const q = searchInput.value.trim().toLowerCase();
      let rows = __allRows;
      if (__activeCustomer) rows = rows.filter(r => r.customer === __activeCustomer);
      if (__activeKikishu) rows = rows.filter(r => r.kikishu === __activeKikishu);
      if (q){
        rows = rows.filter(r =>
          `${r.customer} ${r.hinmei} ${r.serial_full} ${r.inputter} ${r.kikishu||''} ${r.zuban||''} ${r.hinban||''}`.toLowerCase().includes(q)
        );
      }
      render(rows);
    }

    async function loadFromServer(query){
      loadingEl.style.display = 'block';
      emptyEl.style.display = 'none';
      try{
        const res = await apiGAS({ action:'searchLogs', query: query || '', limit: 100 });
        __allRows = (res && res.ok && Array.isArray(res.rows)) ? res.rows : [];
        buildChips();
        applyFilter();
      }catch(e){
        listEl.innerHTML = '';
        countEl.textContent = '';
        emptyEl.style.display = 'block';
        emptyEl.innerHTML = `<div class="big">⚠️</div>読み込みに失敗しました。<br>${(e.message||e)}`;
      }finally{
        loadingEl.style.display = 'none';
      }
    }

    searchInput.addEventListener('input', () => {
      applyFilter();
      clearTimeout(__debounceTimer);
      __debounceTimer = setTimeout(() => loadFromServer(searchInput.value.trim()), 500);
    });

    loadFromServer('');
  </script>
</body>
