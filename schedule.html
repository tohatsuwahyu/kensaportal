<style>
  :root{
    --accent:#1b5fd6; --accent-2:#3b82f6; --ink:#161b22; --sub:#68707c; --faint:#a5abb6; --line:#e7e9ee;
    --bg-1:#eef2f8; --bg-2:#e4ebf6; --card:#ffffff;
    --green:#0f8a53; --green-bg:#e6f7ee; --amber:#b8860b; --amber-bg:#fff6e0;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.04);
    --shadow-md:0 8px 24px rgba(20,30,60,.08);
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --accent:#5b8cff; --accent-2:#7ba2ff; --ink:#eef1f6; --sub:#8b93a3; --faint:#5c6472; --line:#242a35;
    --bg-1:#0b0e14; --bg-2:#11151e; --card:#12161f;
    --green:#2fd88a; --green-bg:#0f2a1e; --amber:#f0c04a; --amber-bg:#2b2311;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:"Inter","Noto Sans JP",-apple-system,sans-serif; color:var(--ink);
    background: radial-gradient(1100px 500px at 12% -10%, rgba(77,124,240,.14) 0%, transparent 60%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height:100vh; -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:24px 18px calc(96px + env(safe-area-inset-bottom)); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .topbar a{ color:var(--sub); text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
  .topbar a svg{ width:15px; height:15px; }
  .theme-toggle{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); box-shadow:var(--shadow-sm); }
  .theme-toggle svg{ width:16px; height:16px; }

  .header{ margin-bottom:20px; }
  .header .eyebrow{ font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .header h1{ font-size:21px; font-weight:800; margin:0; }
  .header p{ margin:6px 0 0; color:var(--sub); font-size:13px; }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow-sm); }
  .tabs .tab{ flex:1; text-align:center; padding:9px 10px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--sub); }
  .tabs .tab.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow-sm); margin-bottom:16px; }
  .panel-title{ font-size:12px; font-weight:700; color:var(--ink); margin-bottom:12px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:9px; }
  .field-grid.three{ grid-template-columns:1fr 1fr 1fr; }
  input, textarea{ width:100%; font-family:inherit; font-size:13.5px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg-1); color:var(--ink); outline:none; resize:vertical; }
  input:focus, textarea:focus{ border-color:var(--accent); background:var(--card); }
  label.f-label{ font-size:10.5px; font-weight:700; color:var(--sub); display:block; margin-bottom:4px; }
  .full{ margin-bottom:9px; }
  details.more{ margin-top:2px; }
  details.more summary{ cursor:pointer; font-size:11.5px; font-weight:700; color:var(--accent); list-style:none; padding:4px 0; }
  details.more summary::-webkit-details-marker{ display:none; }
  .add-btn{ width:100%; padding:12px; border-radius:11px; border:none; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:6px; }
  .add-btn:active{ transform:scale(.98); }

  .toolbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .filter-chips{ display:flex; gap:7px; overflow-x:auto; padding:2px; scrollbar-width:none; flex:1; min-width:0; }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .f-chip{ flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:12px; font-weight:600; color:var(--sub); cursor:pointer; white-space:nowrap; }
  .f-chip.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#fff; }

  .result-count{ font-size:11.5px; font-weight:600; color:var(--sub); margin:0 4px 10px; }
  .list{ display:flex; flex-direction:column; gap:9px; }
  .item{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:12px; }
  .item.done{ opacity:.55; }
  .item-check{ flex:0 0 auto; width:26px; height:26px; border-radius:8px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:transparent; transition:all .15s ease; }
  .item-check.checked{ background:var(--green); border-color:var(--green); color:#fff; }
  .item-check svg{ width:14px; height:14px; }
  .item-main{ flex:1; min-width:0; }
  .item-customer{ font-size:11px; font-weight:600; color:var(--accent); }
  .item-title{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item.done .item-title{ text-decoration:line-through; }
  .item-sub{ font-size:11.5px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-count{ flex:0 0 auto; font-family:var(--mono); font-size:12px; font-weight:700; color:var(--green); background:var(--green-bg); padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .item-del{ flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--faint); cursor:pointer; }

  .action-row{ display:flex; gap:9px; flex-wrap:wrap; }
  .act-btn{ flex:1; min-width:130px; display:flex; align-items:center; justify-content:center; gap:7px; padding:12px; border-radius:11px; font-size:12.5px; font-weight:700; border:none; cursor:pointer; }
  .act-btn svg{ width:15px; height:15px; }
  .act-btn.pdf{ background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; }
  .act-btn.print{ background:linear-gradient(135deg,#0f8a53,#17b56b); color:#fff; }
  .act-btn.mail{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  .act-btn:active{ transform:scale(.97); }

  .empty{ text-align:center; color:var(--sub); padding:50px 10px; font-size:13.5px; }
  .loading{ text-align:center; color:var(--faint); padding:50px 10px; font-size:13px; }
  .toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--bg-1); font-size:12.5px; font-weight:600; padding:11px 20px; border-radius:11px; box-shadow:var(--shadow-md); z-index:100; transition:all .25s cubic-bezier(.16,1,.3,1); pointer-events:none; max-width:80vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- 印刷/PDF専用ドキュメント（隠す） ---------- */
  #printArea{ position:fixed; left:-9999px; top:0; width:190mm; background:#fff; color:#111; padding:10mm; font-family:"Noto Sans JP",sans-serif; }
  #printArea .p-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2mm; }
  #printArea .p-customer{ font-size:13pt; font-weight:700; }
  #printArea .p-contacts{ font-size:9.5pt; color:#333; margin-top:1mm; }
  #printArea .p-company{ font-size:10pt; font-weight:700; }
  #printArea .p-title{ text-align:center; font-size:19pt; font-weight:800; margin:5mm 0 6mm; }
  #printArea .p-meta{ text-align:right; font-size:9.5pt; line-height:1.8; margin-bottom:5mm; }
  #printArea .p-group-title{ font-weight:700; font-size:10.5pt; margin:4mm 0 1.5mm; border-bottom:.4mm solid #333; padding-bottom:1mm; }
  #printArea table{ width:100%; border-collapse:collapse; margin-bottom:4mm; }
  #printArea th, #printArea td{ border:.3mm solid #999; padding:2.6mm 3mm; font-size:9.5pt; text-align:center; white-space:pre-line; vertical-align:middle; }
  #printArea th{ background:#eef0f3; font-weight:700; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line); padding:9px 0 calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(20,30,60,.07);
  }
  html[data-theme="dark"] .bottom-nav{ background:rgba(18,22,31,.92); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--faint); font-size:10.5px; font-weight:700; padding:4px 20px; border-radius:12px; }
  .nav-item svg{ width:22px; height:22px; stroke-width:2; }
  .nav-item.active{ color:var(--accent); }

  @media (max-width:560px){ .field-grid, .field-grid.three{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<style id="kensaAuthStyle">
  #kensaAuthOverlay{position:fixed;inset:0;z-index:99999;background:rgba(10,14,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;font-family:"Inter","Noto Sans JP",-apple-system,sans-serif;}
  #kensaAuthCard{background:#fff;border-radius:20px;padding:32px 26px;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;}
  #kensaAuthCard .icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1b5fd6,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:22px;}
  #kensaAuthCard h2{font-size:15px;margin:0 0 4px;color:#161b22;font-weight:800;}
  #kensaAuthCard p{font-size:12px;color:#68707c;margin:0 0 18px;}
  #kensaAuthCard input{width:100%;font-size:20px;letter-spacing:.3em;text-align:center;padding:13px;border-radius:12px;border:1.5px solid #e7e9ee;outline:none;font-family:monospace;box-sizing:border-box;}
  #kensaAuthCard input:focus{border-color:#1b5fd6;}
  #kensaAuthCard button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#1b5fd6,#3b82f6);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  #kensaAuthCard button:disabled{opacity:.6;}
  #kensaAuthCard .err{color:#b3261e;font-size:12px;margin-top:10px;min-height:14px;}
  #kensaAuthCard .foot{margin-top:16px;font-size:10.5px;color:#a5abb6;}
</style>
<div id="kensaAuthOverlay">
  <div id="kensaAuthCard">
    <div class="icon">&#128274;</div>
    <h2>&#12525;&#12464;&#12452;&#12531;&#12364;&#24517;&#35201;&#12391;&#12377;</h2>
    <p>&#25285;&#24403;&#32773;PIN&#12434;&#20837;&#21147;&#12375;&#12390;&#12367;&#12384;&#12373;&#12356;</p>
    <input id="kensaAuthPin" type="password" inputmode="numeric" autocomplete="off" placeholder="****" maxlength="10" />
    <button id="kensaAuthBtn" type="button">&#12525;&#12464;&#12452;&#12531;</button>
    <div class="err" id="kensaAuthErr"></div>
    <div class="foot">&#26481;&#20140;&#31934;&#23494;&#30330;&#26465;&#26666;&#24335;&#20250;&#31038;</div>
  </div>
</div>
<script>
(function(){
  var AUTH_KEY = 'kensa:session';
  function getSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } }
  function setSession(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(AUTH_KEY); }
  window.__kensaAuth = { getSession: getSession, setSession: setSession, clearSession: clearSession };

  function findGasUrl(){
    if (window.GAS_URL) return window.GAS_URL;
    var m = document.documentElement.innerHTML.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
    return m ? m[0] : null;
  }

  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1 && opts && opts.method === 'POST' && opts.body){
      try{
        var body = JSON.parse(opts.body);
        if (body.action !== 'login'){
          var s = getSession();
          body.token = s ? s.token : '';
        }
        opts = Object.assign({}, opts, { body: JSON.stringify(body) });
      }catch(e){}
    }
    return _fetch(url, opts).then(function(res){
      if (typeof url === 'string' && url.indexOf('script.google.com/macros') !== -1){
        res.clone().json().then(function(j){
          if (j && j.ok === false && (j.error === 'unauthorized' || j.error === 'session-expired')){
            clearSession(); showGate();
          }
        }).catch(function(){});
      }
      return res;
    });
  };

  function showGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'flex';
    setTimeout(function(){ var i = document.getElementById('kensaAuthPin'); if(i) i.focus(); }, 50);
  }
  function hideGate(){
    var el = document.getElementById('kensaAuthOverlay');
    if (el) el.style.display = 'none';
  }

  function doLogin(){
    var pinInput = document.getElementById('kensaAuthPin');
    var errEl = document.getElementById('kensaAuthErr');
    var btn = document.getElementById('kensaAuthBtn');
    var pin = (pinInput.value || '').trim();
    if (!pin){ errEl.textContent = 'PIN\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'; return; }
    var gasUrl = findGasUrl();
    if (!gasUrl){ errEl.textContent = '\u30d0\u30c3\u30af\u30a8\u30f3\u30c9URL\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093'; return; }
    btn.disabled = true; btn.textContent = '\u78ba\u8a8d\u4e2d\u2026'; errEl.textContent = '';
    _fetch(gasUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'login', pin: pin, deviceName: navigator.userAgent.slice(0,60) }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok){
          setSession({ token: data.token, expiresAt: Date.now() + (data.expiresInHours||12) * 3600 * 1000 });
          hideGate();
          location.reload();
        } else {
          errEl.textContent = (data && data.message) || 'PIN\u304c\u9055\u3044\u307e\u3059';
          btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
        }
      })
      .catch(function(){
        errEl.textContent = '\u901a\u4fe1\u30a8\u30e9\u30fc\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
        btn.disabled = false; btn.textContent = '\u30ed\u30b0\u30a4\u30f3';
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('kensaAuthBtn');
    var pinInput = document.getElementById('kensaAuthPin');
    if (btn) btn.addEventListener('click', doLogin);
    if (pinInput) pinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });

    var s = getSession();
    if (!s || !s.token || !s.expiresAt || s.expiresAt < Date.now()){
      clearSession();
      showGate();
    }
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

      <div class="action-row" style="margin-top:10px;">
        <button class="act-btn print" id="btnPrint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>

        </button>
        <button class="act-btn pdf" id="btnPdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          PDFダウンロード
        </button>
        <button class="act-btn mail" id="btnMail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          メールで送信
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 印刷/PDF専用（画面には見えない） -->
  <div id="printArea">
    <div class="p-top">
      <div>
        <div class="p-customer" id="pCustomer"></div>
        <div class="p-contacts" id="pContacts"></div>
      </div>
      <div class="p-company">東京精密発條株式会社</div>
    </div>
    <div class="p-title">出荷確認書</div>
    <div class="p-meta">
      <div>運送会社: <span id="pShipping"></span></div>
      <div>出荷日: <span id="pShipDate"></span></div>
      <div>納入日: <span id="pDeliveryDate"></span></div>
    </div>
    <div id="pGroups"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      ポータル
    </a>
    <a href="schedule.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      予定
    </a>
    <a href="signage.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      TV表示
    </a>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxS2x82HUV6wBw9uZUwRw_2u8LcBhQiol8FZsGxoN_X-CywGMffWHJRMQMMkrNXqaq0Gg/exec';

    const THEME_KEY = 'kensa:theme';
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeIcon').innerHTML = t === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    let __theme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(__theme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      __theme = __theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, __theme);
      applyTheme(__theme);
    });

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    async function apiGAS(body){
      const res = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      if(!res.ok) throw new Error('GAS HTTP '+res.status);
      return await res.json();
    }

    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('emptyState');
    const loadingEl = document.getElementById('loadingState');
    const countEl = document.getElementById('resultCount');

    let __allItems = [];
    let __activeCustomer = null;

    function buildFilterChips(){
      const chipsEl = document.getElementById('filterChips');
      const customers = [...new Set(__allItems.map(it => it.customer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
      if (customers.length === 0){ chipsEl.innerHTML = ''; return; }
      chipsEl.innerHTML = '';
      const allChip = document.createElement('div');
      allChip.className = 'f-chip' + (__activeCustomer===null ? ' active' : '');
      allChip.textContent = `すべて (${__allItems.length})`;
      allChip.onclick = () => { __activeCustomer = null; renderFiltered(); };
      chipsEl.appendChild(allChip);
      customers.forEach(c => {
        const n = __allItems.filter(it => it.customer === c).length;
        const chip = document.createElement('div');
        chip.className = 'f-chip' + (__activeCustomer===c ? ' active' : '');
        chip.textContent = `${c} (${n})`;
        chip.onclick = () => { __activeCustomer = c; renderFiltered(); };
        chipsEl.appendChild(chip);
      });
    }

    function currentFiltered(){
      return __activeCustomer ? __allItems.filter(it => it.customer === __activeCustomer) : __allItems;
    }

    function renderFiltered(){
      buildFilterChips();
      render(currentFiltered());
      // 客先を1つに絞ったら、出荷確認書の客先名も自動で入れておく（毎回打たなくて済むように）
      const shCustomerHint = __activeCustomer || '';
      if (shCustomerHint) document.title = `本日の予定 — ${shCustomerHint}`;
    }

    function render(items){
      countEl.textContent = `本日 ${items.length} 件の予定`;
      if (items.length === 0){ listEl.innerHTML=''; emptyEl.style.display='block'; return; }
      emptyEl.style.display='none';
      listEl.innerHTML = items.map(it => `
        <div class="item ${it.completed?'done':''}">
          <div class="item-check ${it.completed?'checked':''}" onclick="toggleDone('${it.id}', ${!it.completed})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="item-main">
            <div class="item-customer">${it.customer || '—'}${it.group ? ' ・ '+it.group : ''}</div>
            <div class="item-title">${it.hinmei || '（品名未記入）'}</div>
            <div class="item-sub">${it.zuban ? '図番: '+it.zuban : ''}${it.qty ? ' ・ 数量: '+it.qty : ''}${it.note ? ' ・ ' + it.note : ''}</div>
          </div>
          <div class="item-count">${it.inspectedToday}件検査済</div>
          <button class="item-del" onclick="deleteItem('${it.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      `).join('');
    }

    async function load(){
      try{
        const res = await apiGAS({ action:'getScheduleToday' });
        __allItems = (res && res.ok && Array.isArray(res.items)) ? res.items : [];
        renderFiltered();
      }catch(e){
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        emptyEl.textContent = '読み込みに失敗しました — ' + (e.message||e);
      }finally{
        loadingEl.style.display = 'none';
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const customer = document.getElementById('inCustomer').value.trim();
      if (!customer){ alert('客先名を入力してください。'); return; }
      const payload = {
        customer,
        hinmei: document.getElementById('inHinmei').value.trim(),
        zuban: document.getElementById('inZuban').value.trim(),
        kikishu: document.getElementById('inKikishu').value.trim(),
        qty: document.getElementById('inQty').value.trim(),
        destination: document.getElementById('inDestination').value.trim(),
        remarks: document.getElementById('inRemarks').value.trim(),
        orderNo: document.getElementById('inOrderNo').value.trim(),
        group: document.getElementById('inGroup').value.trim(),
        note: document.getElementById('inNote').value.trim(),
      };
      try{
        await apiGAS({ action:'addScheduleItem', ...payload });
        ['inCustomer','inHinmei','inZuban','inKikishu','inQty','inDestination','inRemarks','inOrderNo','inGroup','inNote']
          .forEach(id => document.getElementById(id).value = '');
        load();
      }catch(e){ alert('追加に失敗しました: ' + (e.message||e)); }
    });

    async function toggleDone(id, completed){
      try{ await apiGAS({ action:'markScheduleDone', id, completed }); load(); }
      catch(e){ alert('更新に失敗しました: ' + (e.message||e)); }
    }
    async function deleteItem(id){
      if (!confirm('この予定を削除しますか？')) return;
      try{ await apiGAS({ action:'deleteScheduleItem', id }); load(); }
      catch(e){ alert('削除に失敗しました: ' + (e.message||e)); }
    }

    /* ---------- 出荷確認書として印刷/PDF/メール ---------- */
    function fmtDate(iso){
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
    }

    function buildPrintDoc(){
      const items = currentFiltered();
      if (items.length === 0){ alert('印刷する予定がありません。客先を絞り込むか、予定を追加してください。'); return false; }

      const customerBase = __activeCustomer || document.getElementById('inCustomer').value.trim() || '客先未選択';
      const honorific = document.getElementById('shHonorific').value.trim();
      document.getElementById('pCustomer').textContent = customerBase + (honorific ? ' '+honorific : '');
      document.getElementById('pContacts').textContent = document.getElementById('shContacts').value.trim();
      document.getElementById('pShipping').textContent = document.getElementById('shShipping').value.trim() || '—';
      document.getElementById('pShipDate').textContent = fmtDate(document.getElementById('shShipDate').value);
      document.getElementById('pDeliveryDate').textContent = fmtDate(document.getElementById('shDeliveryDate').value);

      const groups = {}; const order = [];
      items.forEach(it => {
        const g = it.group || '__NOGROUP__';
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(it);
      });

      const html = order.map(g => {
        const rows = groups[g].map(it => `
          <tr>
            <td>${it.zuban||''}</td>
            <td>${it.kikishu||''}</td>
            <td>${it.hinmei||''}</td>
            <td>${it.qty||''}</td>
            <td>${it.destination||''}</td>
            <td>${it.orderNo||''}</td>
            <td>${it.remarks||''}</td>
          </tr>`).join('');
        const groupTitle = g !== '__NOGROUP__' ? `<div class="p-group-title">${g}</div>` : '';
        return `${groupTitle}<table><thead><tr><th>図番</th><th>機種</th><th>商品名</th><th>数量</th><th>送り先</th><th>注番</th><th>備考</th></tr></thead><tbody>${rows}</tbody></table>`;
      }).join('');
      document.getElementById('pGroups').innerHTML = html;
      return true;
    }

    async function buildPdfBlob(){
      const el = document.getElementById('printArea');
      const prevLeft = el.style.left;
      el.style.left = '0px'; el.style.zIndex = '-1';
      try{
        const canvas = await html2canvas(el, { scale:2, backgroundColor:'#FFFFFF' });
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
        const pageW = 210, pageH = 297, margin = 10;
        const imgW = pageW - margin*2;
        const imgH = canvas.height * imgW / canvas.width;
        const usableH = pageH - margin*2;
        const imgData = canvas.toDataURL('image/png');
        let heightLeft = imgH, position = margin;
        doc.addImage(imgData, 'PNG', margin, position, imgW, imgH);
        heightLeft -= usableH;
        while (heightLeft > 0){
          position -= usableH;
          doc.addPage();
          doc.addImage(imgData, 'PNG', margin, position, imgW, imgH);
          heightLeft -= usableH;
        }
        return doc;
      } finally {
        el.style.left = prevLeft; el.style.zIndex = '';
      }
    }

    document.getElementById('btnPrint').addEventListener('click', async () => {
      if (!buildPrintDoc()) return;
      const doc = await buildPdfBlob();
      doc.autoPrint();
      window.open(doc.output('bloburl'), '_blank');
    });

    document.getElementById('btnPdf').addEventListener('click', async () => {
      if (!buildPrintDoc()) return;
      const doc = await buildPdfBlob();
      const customer = (__activeCustomer || 'customer').replace(/[\\/:*?"<>|]/g,'');
      const ymd = new Date().toISOString().slice(0,10).replace(/-/g,'');
      doc.save(`出荷確認書_${customer}_${ymd}.pdf`);
    });

    document.getElementById('btnMail').addEventListener('click', async () => {
      if (!buildPrintDoc()) return;
      const to = prompt('送信先メールアドレスを入力してください：');
      if (!to) return;
      showToast('送信準備中…');
      try{
        const doc = await buildPdfBlob();
        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const customer = __activeCustomer || '';
        const res = await apiGAS({
          action:'sendShipmentEmail', to,
          subject: `出荷確認書のご案内（${customer}）`,
          filename: `出荷確認書_${customer.replace(/[\\/:*?"<>|]/g,'')||'no-customer'}.pdf`,
          pdfBase64
        });
        if (res && res.ok) showToast('✅ メールを送信しました');
        else throw new Error(res && res.message || '送信に失敗しました');
      }catch(e){ showToast('⚠️ 送信失敗: ' + (e.message||e)); }
    });

    load();
  </script>
</body>
